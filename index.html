<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="週日沙龍：每週線上讀書會的會前導讀、影片章節、論證地圖、討論題與自我測驗。">
<meta property="og:title" content="週日沙龍">
<meta property="og:description" content="這週：靈魂存在嗎？如果存在，它會永生嗎？（Yale PHIL 176 Death 第 5–7 講）">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>週日沙龍</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&display=swap">
<style>
:root{
  --bg:#F2F3F6; --surface:#FFFFFF; --surface-2:#E9EBF1; --ink:#1A1D2B; --ink-2:#474C60; --ink-3:#767B8F; --line:#D6D9E3;
  --accent:#95680F; --accent-soft:#F4E8CF; --dusk:#3D4378; --dusk-soft:#E3E5F3;
  --good:#2C7549; --good-soft:#DCEEE3; --bad:#A03F38; --bad-soft:#F6DFDC;
  --shadow:0 12px 40px rgba(26,29,43,.18);
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1120; --surface:#161A2C; --surface-2:#1E2339; --ink:#E7E8EF; --ink-2:#B3B7C7; --ink-3:#868BA1; --line:#2B3149;
    --accent:#E2B455; --accent-soft:#2F2815; --dusk:#AAB0E8; --dusk-soft:#232849;
    --good:#6CC291; --good-soft:#16301F; --bad:#E88C82; --bad-soft:#3B1D1B; --shadow:0 12px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1120; --surface:#161A2C; --surface-2:#1E2339; --ink:#E7E8EF; --ink-2:#B3B7C7; --ink-3:#868BA1; --line:#2B3149;
  --accent:#E2B455; --accent-soft:#2F2815; --dusk:#AAB0E8; --dusk-soft:#232849;
  --good:#6CC291; --good-soft:#16301F; --bad:#E88C82; --bad-soft:#3B1D1B; --shadow:0 12px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;padding-inline:16px;padding-block:0 80px}
a{color:var(--dusk)}
a:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
button{font-family:var(--sans)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px 0}
.topbar-in{max-width:1120px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand b{font-family:var(--serif);font-weight:900;font-size:18px;letter-spacing:.08em}
.brand-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{font:500 13px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:999px;padding:3px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chap-btn{display:none}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;color:var(--ink-3);font:500 14px var(--sans);padding:8px 10px 10px;cursor:pointer;border-bottom:2px solid transparent;display:flex;align-items:baseline;gap:6px}
.tabs button .step{font:500 11px var(--mono)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* layout */
.layout{max-width:1120px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:40px;padding-top:28px}
main{display:flex;flex-direction:column;gap:40px;min-width:0;max-width:760px}
aside.side{display:none}
@media (min-width:1000px){
  .layout{max-width:1240px;grid-template-columns:minmax(0,1fr) 300px}
  body.embed .layout{grid-template-columns:minmax(0,1fr) 420px}
  aside.side{display:block;position:sticky;top:calc(var(--tb,116px) + 16px);align-self:start;max-height:calc(100vh - var(--tb,116px) - 32px);overflow-y:auto;scrollbar-width:thin}
}
@media (max-width:999px){
  .chap-btn{display:inline-flex}
  body.embed.playing aside.side{display:block;order:-1;position:sticky;top:var(--tb,100px);z-index:5;background:var(--bg);margin-inline:-16px;padding:8px 16px 0;border-bottom:1px solid var(--line)}
  body.embed.playing aside.side .chap-list{display:none}
  body.embed .hide-player{display:inline-flex}
  .ratio{border-radius:4px}
}

/* hero */
.hero{display:flex;flex-direction:column;gap:12px}
.eyebrow{font:500 12px var(--mono);letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(28px,5vw,40px);line-height:1.3;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:4px 20px;font-size:14px;color:var(--ink-3)}
.meta b{color:var(--ink);font-weight:500}

section{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--serif);font-weight:900;font-size:24px;margin:0;line-height:1.35;text-wrap:balance}
h3{font-size:17px;margin:0;line-height:1.5;text-wrap:balance}
.muted{color:var(--ink-3);font-size:14px}
.why{font-size:13px;color:var(--ink-3);display:flex;gap:6px;align-items:baseline}
.why::before{content:"學習法";flex:none;font:500 11px var(--sans);color:var(--dusk);background:var(--dusk-soft);border-radius:3px;padding:0 6px}
.lede{color:var(--ink-2);font-size:17px}

.tldr{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.tldr li{padding-left:18px;position:relative}
.tldr li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--accent)}

.guideqs{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.guideqs li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.guideqs .lec{font:500 12px var(--mono);color:var(--accent)}
.guideqs .q{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.55}

.callout{background:var(--dusk-soft);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:15px}
.callout strong{color:var(--dusk)}
.picks{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.picks li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.picks a{font:500 13px var(--mono)}

details.fold{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details.fold>summary{cursor:pointer;list-style:none;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:700}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:"+";font:500 18px var(--mono);color:var(--ink-3)}
details.fold[open]>summary::after{content:"−"}
details.fold>.body{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.stance{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:15px}
.stance dt{color:var(--ink-3)} .stance dd{margin:0}

.btn{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--sans);color:var(--bg);background:var(--ink);border:0;border-radius:4px;padding:6px 12px;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.link{background:none;border:0;color:var(--dusk);padding:0;text-decoration:underline;font-size:13px}

/* player */
.player-box{position:sticky;top:0;z-index:2;background:var(--bg);padding-bottom:12px;display:none}
body.embed .player-box{display:block}
.ratio{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:6px;overflow:hidden}
.ratio iframe,.ratio #player{position:absolute;inset:0;width:100%;height:100%;border:0}
.player-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:8px;font-size:13px;color:var(--ink-2)}
.player-bar #now{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hide-player{display:none}
.chapters li.now{color:var(--ink);font-weight:700}
.chapters li.now a{color:var(--accent)}

/* chapters (sidebar + drawer) */
.chap-head{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.chap-head b{font-family:var(--serif);font-size:16px}
.vgroup{border-bottom:1px solid var(--line)}
.vgroup>summary{cursor:pointer;list-style:none;padding:10px 0;display:flex;flex-direction:column;gap:0}
.vgroup>summary::-webkit-details-marker{display:none}
.vgroup .lec{font:500 11px var(--mono);color:var(--accent);letter-spacing:.06em}
.vgroup .vt{font-size:14px;font-weight:700;line-height:1.5}
.vgroup[open] .vt{color:var(--ink)}
.chapters{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column}
.chapters li{display:grid;grid-template-columns:3.4em 1fr;gap:8px;padding:3px 0;font-size:13px;line-height:1.6;color:var(--ink-2)}
.chapters a{font:500 12px var(--mono);font-variant-numeric:tabular-nums;text-decoration:none;color:var(--dusk);padding-top:1px}
.chapters a:hover{text-decoration:underline}
.watch{font-size:12px;margin-bottom:10px;display:inline-block}

.drawer-scrim{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:20}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:12px 12px 0 0;box-shadow:var(--shadow);max-height:75vh;overflow-y:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}

/* argument map */
.args{display:flex;flex-direction:column;gap:12px}
.arg>summary{justify-content:flex-start}
.arg .state{margin-left:auto;flex:none}
.arg .tag{display:block;font:500 12px var(--mono);color:var(--ink-3);font-weight:500}
.arg .state{font:500 12px var(--sans);color:var(--ink-3);font-weight:500}
.arg.done .state{color:var(--good)}
.prem{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prem li{display:grid;grid-template-columns:2.4em 1fr;gap:8px;align-items:start;padding:8px 10px;border-radius:4px;background:var(--surface-2);border:1px solid transparent}
.prem li.pickable{cursor:pointer}
.prem li.pickable:hover{border-color:var(--ink-3)}
.prem li.picked{border-color:var(--accent)}
.prem .n{font:500 13px var(--mono);color:var(--ink-3);padding-top:3px}
.prem li.concl{background:transparent;border-top:2px solid var(--ink);border-radius:0;padding-top:10px}
.prem li.concl .n{color:var(--ink)}
.obj,.acc{display:none;margin-top:6px;font-size:14px;line-height:1.65}
.obj{color:var(--bad)} .acc{color:var(--good)}
.obj b,.acc b{display:inline-block;font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:3px;padding:0 5px;margin-right:6px;line-height:1.5}
.arg.reveal .prem li.weak{background:var(--bad-soft)}
.arg.reveal .prem li.weak .n{color:var(--bad)}
.arg.reveal .prem li.ok{background:var(--good-soft)}
.arg.reveal .prem li.ok .n{color:var(--good)}
.arg.reveal .obj,.arg.reveal .acc{display:block}
.verdict{display:none;font-size:15px;color:var(--ink-2);border-left:3px solid var(--accent);padding-left:12px}
.arg.reveal .verdict{display:block}
.predict{font-size:14px;color:var(--ink-2)}
.predict b{color:var(--accent)}
.feedback{display:none;font-size:14px;font-weight:700}
.arg.reveal .feedback{display:block}
.arg-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* review timeline */
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.timeline li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.timeline .when{font:500 12px var(--mono);color:var(--accent)}

/* recall */
.recall{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.recall li{display:flex;flex-direction:column;gap:6px}
.recall .rq{font-weight:500}
.recall summary::-webkit-details-marker{display:none}
.recall .ra{font-size:14px;color:var(--ink-2);background:var(--surface-2);border-radius:4px;padding:10px 12px}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:28px}
.score{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink-3)}
.score b{font:500 15px var(--mono);color:var(--ink)}
.qz{display:flex;flex-direction:column;gap:10px}
.qz h3{font-size:16px}
.qz .from{font:500 11px var(--mono);color:var(--ink-3);display:block;font-weight:500}
.opts{display:flex;flex-direction:column;gap:6px}
.opts button{text-align:left;font:15px/1.6 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 12px;cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--ink-3)}
.opts button:disabled{cursor:default}
.opts button.right{background:var(--good-soft);border-color:var(--good)}
.opts button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.explain{font-size:14px;color:var(--ink-2);line-height:1.7}
.explain b.ok{color:var(--good)} .explain b.no{color:var(--bad)}

/* cards */
.card-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink-3)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column}
.card.shaky{border-color:var(--bad)}
.card-face{min-height:110px;text-align:left;background:none;border:0;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.card .term{font-family:var(--serif);font-weight:900;font-size:19px}
.card .en{font:12px var(--mono);color:var(--ink-3)}
.card .def{display:none;font-size:14px;line-height:1.65;color:var(--ink-2)}
.card .hint{margin-top:auto;font-size:12px;color:var(--ink-3)}
.card.open{background:var(--accent-soft);border-color:var(--accent)}
.card.open .def{display:block}
.card.open .hint{display:none}
.rate{display:none;gap:6px;padding:0 14px 12px}
.card.open .rate{display:flex}
.rate button{flex:1;font:500 13px var(--sans);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:4px;padding:4px 0;cursor:pointer}
.rate button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}

/* sunday */
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{counter-increment:s;display:grid;grid-template-columns:1.8em 1fr;gap:8px;font-size:15px}
.steps li::before{content:counter(s);font:500 13px var(--mono);color:var(--dusk);padding-top:2px}
.votes{display:flex;flex-direction:column;gap:14px}
.vote{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:10px}
.vote-row{display:grid;grid-template-columns:4.5em 1fr;gap:8px;align-items:center;font-size:13px;color:var(--ink-3)}
.vote-opts{display:flex;gap:6px;flex-wrap:wrap}
.vote-opts button{font:14px var(--sans);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:3px 12px;cursor:pointer}
.vote-opts button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vote .shift{font-size:13px;color:var(--accent)}
.dq{counter-reset:q;list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.dq li{counter-increment:q;display:grid;grid-template-columns:2em 1fr;gap:10px}
.dq li::before{content:counter(q);font-family:var(--serif);font-weight:900;font-size:22px;color:var(--accent);line-height:1.3}
.dq .ext{display:inline-block;font:500 11px var(--sans);color:var(--dusk);background:var(--dusk-soft);border-radius:3px;padding:0 6px;margin-left:6px;vertical-align:2px}
.dq .ctx{display:block;font-size:14px;color:var(--ink-3);margin-top:4px}

.after{border:1px dashed var(--line);border-radius:6px;padding:22px;display:flex;flex-direction:column;gap:8px;color:var(--ink-2)}
.next{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:16px;flex-wrap:wrap}
footer{font-size:13px;color:var(--ink-3);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:20px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <b>週日沙龍</b>
      <div class="brand-r">
        <div id="sessions" style="display:flex;gap:6px" aria-label="場次"></div>
        <button class="chip chap-btn" type="button" id="open-drawer">影片章節</button>
      </div>
    </div>
    <div class="tabs" role="tablist" id="tabs" aria-label="學習階段"></div>
  </div>
</div>

<div class="layout">
  <main id="app"></main>
  <aside class="side" id="side" aria-label="影片與章節">
    <div class="player-box">
      <div class="ratio"><div id="player"></div></div>
      <div class="player-bar"><span id="now"></span><button class="btn ghost hide-player" type="button" id="hide-player">收起影片</button></div>
    </div>
    <div class="chap-list" id="chap-list"></div>
  </aside>
</div>
<div class="drawer-scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" hidden role="dialog" aria-label="影片章節"></div>

<script>
const SESSIONS = [
{
  id: 'w1',
  chip: '10/4 靈魂',
  date: '2026 年 10 月 4 日（週日）',
  eyebrow: 'Session 01 · Yale PHIL 176 Death',
  title: '靈魂存在嗎？如果存在，它會永生嗎？',
  lede: '這週看耶魯 Shelly Kagan 教授《死亡》課的第 5 到 7 講。前半段他逐一拆解「靈魂存在」的論證，後半段進入柏拉圖《斐多篇》，看蘇格拉底在臨死前如何論證靈魂不朽。',
  speaker: 'Shelly Kagan（耶魯大學哲學系）',
  captionTip: '影片是英文授課。播放器右下角按「設定（齒輪）」→「字幕」→「自動翻譯」→「中文（繁體）」可以看機器翻譯的中文字幕，專有名詞偶爾會翻錯，可以先翻一下「看完回想」裡的名詞卡。',
  picks: [
    ['講座 5', 'S-fwH_uBPD0', 0, '00:00–15:20', '自由意志論證（15 分鐘）'],
    ['講座 5', 'S-fwH_uBPD0', 1037, '17:17–30:41', '瀕死體驗（13 分鐘）'],
    ['講座 6', 'qkjIKIpvz6Y', 346, '05:46–18:27', '晨星與昏星（13 分鐘）'],
    ['講座 7', 'ZHH8KDFysbM', 2030, '33:50–46:38', '回憶說（13 分鐘）'],
  ],
  tldr: [
    'Kagan 檢查的多數靈魂論證都是「最佳解釋推論」：某個現象需要解釋，所以假設靈魂存在。他的問題永遠是：靈魂是不是<b>最好的</b>解釋，而不只是<b>一種</b>解釋。',
    '自由意志論證需要三個前提同時成立，而每一個都有人提出合理的質疑。',

const yt = (id, t) => `https://www.youtube.com/watch?v=${id}${t ? `&t=${t}s` : ''}`;
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
const ext = (href, text, cls = '') => `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${text}</a>`;
/* 時間戳連結：有內嵌播放器時直接跳段，沒有時（例如在 claude.ai 上）照常開新分頁 */
const ytLink = (id, t, text, cls = '') =>
  `<a class="${cls}" href="${yt(id, t)}" target="_blank" rel="noopener" data-yt="${id}" data-t="${t || 0}">${text}</a>`;
const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(([, v]) => v);
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)) } catch { return null } },

const argCard = (a, i, picks) => {
  const pick = picks[i];
  const done = pick !== undefined;
  return `
  <details class="fold arg ${done ? 'reveal done' : ''}" id="arg-${i}">
    <summary><span><span class="tag">${a.kind} · ${a.ts}</span>${a.name}</span><span class="state">${done ? '已作答' : '未作答'}</span></summary>
    <div class="body">
      <p class="predict">${done ? '' : '<b>先猜猜看：</b>你覺得哪一個前提最站不住？點一下選它。'}</p>
      <ol class="prem">
        ${a.prem.map(([text, obj, ok], j) => `
          <li class="${obj ? 'weak' : 'ok'} ${done ? '' : 'pickable'} ${pick === j ? 'picked' : ''}" data-arg="${i}" data-p="${j}">
            <span class="n">P${j + 1}</span>
            <div>${text}${obj ? `<div class="obj"><b>質疑</b>${obj}</div>` : ''}${ok ? `<div class="acc"><b>接受</b>${ok}</div>` : ''}</div></li>`).join('')}
        <li class="concl"><span class="n">∴</span><div><b>${a.concl}</b></div></li>
      </ol>
      <p class="feedback">${done ? feedbackText(a, pick) : ''}</p>
      <p class="verdict">${a.verdict}</p>
      <div class="arg-foot">
        ${ytLink(a.vid, a.t, '看這段影片 ▸')}
        ${done ? `<button class="btn link" type="button" data-redo="${i}">重新猜</button>` : `<button class="btn link" type="button" data-skip="${i}">直接看答案</button>`}
      </div>
    </div>
  </details>`;
};

const feedbackText = (a, pick) => {
  if (pick === -1) return '';
  const hit = !!a.prem[pick][1];
  return hit
    ? `<span style="color:var(--good)">你選了 P${pick + 1}，Kagan 也質疑這一步。</span>`
    : `<span style="color:var(--accent)">你選了 P${pick + 1}，但 Kagan 接受這一步。看看他質疑的是哪裡。</span>`;
};

/* ---------- interactions ---------- */
const bindArgs = s => {
  const key = `salon-arg-${s.id}`;
  const save = (i, val) => {
    const picks = store.get(key) || {};
    if (val === undefined) delete picks[i]; else picks[i] = val;
    store.set(key, picks);
    const el = document.getElementById(`arg-${i}`);
    el.outerHTML = argCard(s.args[i], i, picks);
    const fresh = document.getElementById(`arg-${i}`);
    fresh.open = true;
    bindArgs(s);
  };
  document.querySelectorAll('.prem li.pickable').forEach(li => li.onclick = () => save(+li.dataset.arg, +li.dataset.p));
  document.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => save(+b.dataset.skip, -1));
  document.querySelectorAll('[data-redo]').forEach(b => b.onclick = () => save(+b.dataset.redo, undefined));
};

const bindQuiz = s => {
  const key = `salon-quiz-${s.id}`;
  const saved = store.get(key);
  const state = saved && Array.isArray(saved.order) ? saved : { order: s.quiz.map((_, i) => i), ans: {} };
  const list = document.getElementById('quiz-list');
  const scoreEl = document.getElementById('score');
  const vidName = id => s.videos.find(v => v.id === id).lec.split(' · ')[0];
  const updateScore = () => {
    const right = Object.entries(state.ans).filter(([i, a]) => s.quiz[i].a === a).length;
    scoreEl.textContent = `${right} / ${s.quiz.length}`;
  };
  const show = (box, i, pick) => {
    const q = s.quiz[i];
    box.querySelectorAll('.opts button').forEach((b, j) => {
      b.disabled = true;
      if (j === q.a) b.classList.add('right');
      else if (j === pick) b.classList.add('wrong');
    });
    const ex = box.querySelector('.explain');
    ex.innerHTML = `<b class="${pick === q.a ? 'ok' : 'no'}">${pick === q.a ? '答對了。' : '再想想。'}</b>${q.e} ${ytLink(q.t[0], q.t[1], '看原片段 ▸')}`;
    ex.hidden = false;
  };
  list.innerHTML = state.order.map((i, n) => {
    const q = s.quiz[i];
    return `<div class="qz" data-q="${i}">
      <h3><span class="from">${vidName(q.t[0])}</span>${n + 1}. ${q.q}</h3>
      <div class="opts">${q.o.map((o, j) => `<button type="button" data-o="${j}">${o}</button>`).join('')}</div>
      <p class="explain" hidden></p></div>`;
  }).join('');
  list.querySelectorAll('.qz').forEach(box => {
    const i = +box.dataset.q;
    if (state.ans[i] !== undefined) show(box, i, state.ans[i]);
    box.querySelectorAll('.opts button').forEach(b => b.onclick = () => {
      state.ans[i] = +b.dataset.o;
      store.set(key, state);
      show(box, i, state.ans[i]);
      updateScore();
    });
  });
  document.getElementById('quiz-reset').onclick = () => {
    store.set(key, { order: shuffle(s.quiz.map((_, i) => i)), ans: {} });
    bindQuiz(s);
  };
  updateScore();
};

const bindCards = s => {
  const key = `salon-cards-${s.id}`;
  const rates = store.get(key) || {};
  let onlyShaky = false;
  const draw = () => {
    const shakyCount = Object.values(rates).filter(r => r === 'shaky').length;
    document.getElementById('card-count').textContent =
      `${s.terms.length} 張・還不熟 ${shakyCount} 張・記得 ${Object.values(rates).filter(r => r === 'known').length} 張`;
    const items = s.terms.map((t, i) => [t, i]).filter(([, i]) => !onlyShaky || rates[i] === 'shaky');
    const box = document.getElementById('cards');
    box.innerHTML = items.length ? items.map(([[t, en, d], i]) => `
      <div class="card ${rates[i] === 'shaky' ? 'shaky' : ''}" data-c="${i}">
        <button class="card-face" type="button" aria-expanded="false">
          <span class="term">${t}</span><span class="en">${en}</span>
          <span class="def">${d}</span><span class="hint">先想想意思，再點開</span>
        </button>
        <div class="rate">
          <button type="button" data-r="shaky" aria-pressed="${rates[i] === 'shaky'}">還不熟</button>
          <button type="button" data-r="known" aria-pressed="${rates[i] === 'known'}">記得</button>
        </div>
      </div>`).join('') : '<p class="muted">沒有標成「還不熟」的卡片。</p>';
    box.querySelectorAll('.card').forEach(c => {
      const i = +c.dataset.c;
      c.querySelector('.card-face').onclick = e => {
        const open = c.classList.toggle('open');
        e.currentTarget.setAttribute('aria-expanded', open);
      };
      c.querySelectorAll('[data-r]').forEach(b => b.onclick = () => {
        rates[i] = b.dataset.r;
        store.set(key, rates);
        draw();
      });
    });
  };
  const f = document.getElementById('card-filter');
  f.onclick = () => {
    onlyShaky = !onlyShaky;
    f.setAttribute('aria-pressed', onlyShaky);
    f.textContent = onlyShaky ? '顯示全部' : '只看還不熟的';
    draw();
  };
  draw();
};

const bindVotes = s => {
  const key = `salon-vote-${s.id}`;
  document.querySelectorAll('[data-vote]').forEach(b => b.onclick = () => {
    const v = store.get(key) || {};
    const i = b.dataset.vote;
    v[i] = { ...(v[i] || {}), [b.dataset.phase]: +b.dataset.o };
    store.set(key, v);
    renderMain(s);
  });
};

const bindMain = s => {
  document.querySelectorAll('[data-goto]').forEach(b => b.onclick = () => setTab(b.dataset.goto));
  if (tab === 'during') bindArgs(s);
  if (tab === 'recall') { bindQuiz(s); bindCards(s); }
  if (tab === 'sunday') bindVotes(s);
};

/* ---------- shell ---------- */
const renderTabs = () => {
  const el = document.getElementById('tabs');
  el.innerHTML = TABS.map(([k, label], n) =>
    `<button type="button" role="tab" data-tab="${k}" aria-selected="${k === tab}"><span class="step">${n + 1}</span>${label}</button>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
};

const setTab = k => {
  tab = TABS.some(([t]) => t === k) ? k : 'before';
  store.set('salon-tab', tab);
  try { history.replaceState(null, '', `#${tab}`); } catch {}
  renderTabs();
  renderMain(cur);
  window.scrollTo({ top: 0 });
};

const openDrawer = on => {
  document.getElementById('drawer').hidden = !on;
  document.getElementById('scrim').hidden = !on;
};

const renderSession = id => {
  cur = SESSIONS.find(x => x.id === id) || SESSIONS[SESSIONS.length - 1];
  store.set('salon-session', cur.id);
  document.getElementById('sessions').innerHTML = SESSIONS.map(s =>
    `<button class="chip" type="button" data-s="${s.id}" aria-pressed="${s.id === cur.id}">${s.chip}</button>`).join('');
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => renderSession(b.dataset.s));
  document.getElementById('chap-list').innerHTML = renderChapters(cur);
  document.getElementById('drawer').innerHTML = renderChapters(cur) +
    '<div style="padding-top:12px"><button class="btn ghost" type="button" id="close-drawer">關閉</button></div>';
  document.getElementById('close-drawer').onclick = () => openDrawer(false);
  renderTabs();
  renderMain(cur);
};

document.getElementById('open-drawer').onclick = () => openDrawer(true);
document.getElementById('scrim').onclick = () => openDrawer(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') openDrawer(false); });

/* ---------- embedded player (YouTube IFrame API) ---------- */
const player = { yt: null, ready: false, vid: null, pending: null };

const syncTopbar = () =>
  document.documentElement.style.setProperty('--tb', `${document.querySelector('.topbar').offsetHeight}px`);

const play = (id, t = 0) => {
  document.body.classList.add('playing');
  const group = document.querySelector(`#chap-list [data-vgroup="${id}"]`);
  if (group) group.open = true;
  if (!player.ready) { player.pending = [id, t]; return; }
  if (player.vid !== id) {
    player.yt.loadVideoById({ videoId: id, startSeconds: t });
    player.vid = id;
  } else {
    player.yt.seekTo(t, true);
    player.yt.playVideo();
  }
};

/** 依播放時間標出目前章節，並顯示在播放器下方 */
const markNow = () => {
  if (!player.ready || !cur) return;
  const v = cur.videos.find(x => x.id === player.vid);
  if (!v) return;
  const sec = player.yt.getCurrentTime?.() || 0;
  const idx = v.chapters.reduce((hit, [t], i) => (sec >= t ? i : hit), 0);
  document.getElementById('now').textContent = `${v.lec.split(' · ')[0]}・${v.chapters[idx][1]}`;
  document.querySelectorAll('.chapters li').forEach(li =>
    li.classList.toggle('now', li.dataset.vid === v.id && +li.dataset.t === v.chapters[idx][0]));
};

window.onYouTubeIframeAPIReady = () => {
  document.body.classList.add('embed');
  syncTopbar();
  const first = cur.videos[0].id;
  player.yt = new YT.Player('player', {
    videoId: first,
    playerVars: { rel: 0, playsinline: 1, hl: 'zh-TW', cc_lang_pref: 'zh-Hant' },
    events: {
      onReady: () => {
        player.ready = true;
        player.vid = first;
        if (player.pending) { play(...player.pending); player.pending = null; }
      },
    },
  });
  setInterval(markNow, 1000);
};

document.addEventListener('click', e => {
  const a = e.target.closest('a[data-yt]');
  if (!a || !document.body.classList.contains('embed')) return;
  e.preventDefault();
  openDrawer(false);
  play(a.dataset.yt, +a.dataset.t);
});

document.getElementById('hide-player').onclick = () => {
  if (player.ready) player.yt.pauseVideo();
  document.body.classList.remove('playing');
};

window.addEventListener('resize', syncTopbar);

const loadYouTubeApi = () => {
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = () => {}; // 被擋（例如在 claude.ai 上）時維持一般連結
  document.head.appendChild(tag);
};

const hashTab = location.hash.slice(1);
tab = TABS.some(([t]) => t === hashTab) ? hashTab : (store.get('salon-tab') || 'before');
renderSession(store.get('salon-session') || SESSIONS[SESSIONS.length - 1].id);
syncTopbar();
loadYouTubeApi();
</script>
</body>
