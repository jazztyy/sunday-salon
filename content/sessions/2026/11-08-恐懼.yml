    recall:
      - - 「活著然後死去」可能有哪些交互作用？
        - 正面：生命有限、會消逝，所以更珍貴。負面一「嘗一口就拿走」：讓餓的人嘗一口美食再端走，比完全沒嘗過更難受。負面二「高貴者的墜落」：能愛、能寫詩、能思考宇宙的人，最後變成腐爛的屍體，就像被廢黜的國王去當服務生。
      - - 為什麼 Kagan 說就算接受「不出生比較好」，也推不出應該自殺？
        - 自殺改變不了「活著然後死去」這個處境，也不會讓你沒出生過。它只是讓那一口更短、讓墜落提早。他也說明這不代表自殺永遠不合適，留到最後幾講再談。
      - - 消化道的例子想區分什麼？Kagan 對「要不要想死亡」的結論是什麼？
        - 區分「原因」和「理由」：有些事實只是讓你改變行為，卻沒有給你改變的理由，例如親吻時想著對方的消化道。這種事實忽略它沒有問題。Kagan 認為「永遠別想死亡」和「永遠想著死亡」都不對，要看時間和場合。
