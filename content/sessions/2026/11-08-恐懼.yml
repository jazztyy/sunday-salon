tldr:
  - 第 20 講補完生命的價值。<b>中性容器理論</b>只算人生裡裝了什麼；<b>有價值的容器理論</b>說，以人的方式活著本身就加分。Kagan 頂多接受溫和版：內容夠糟，活著的價值還是會被蓋過。
  - 剝奪說之外，死亡還有其他特徵：必然、人人都會、長短不一、無法預測、隨時可能發生。每一項都可能讓死更糟，有些也可能讓人好受一點。
  - 人生不只是好事加總。形狀也重要：幾乎每個人都寧可先苦後甜。組合也會產生交互作用：「活著然後死去」可能讓生命更珍貴，也可能是「讓你嘗一口再拿走」。
  - 第 22 講：恐懼要合理，對象得是壞的、機率不可忽略、還要有不確定性。Kagan 認為「死了」不符合這些條件，最多只能對「可能太早死」有一點擔心。
  - 對死亡生氣也不合理：宇宙不是行動者，上帝也不欠我們更多壽命。Kagan 認為比較合適的回應是悲傷，以及感恩自己有機會活過。
  - 第 23 講：時間相對於值得做的事太短，所以要小心選、小心做。Kagan 認為品質比總量重要，留下的成就能讓人生更有價值；但他也懷疑這是不是自我安慰。
stance:
  - - 活著本身
    - 有時傾向中性容器理論，有時傾向有價值的容器理論，但只接受溫和版
  - - 永生與死得太早
    - 永生終究會變糟，所以會死是好事；但大多數人在人生變糟之前就死了，死得太早
  - - 要不要想死亡
    - 有時候該想、有時候不該。死亡的事實有些只是「原因」，不一定都是「理由」
  - - 怕死
    - 大多不合理。害怕痛苦的死亡過程可以合理；害怕「死了」不合理；對「太早死」最多一點擔心
  - - 該有的情緒
    - 不是恐懼，也不是憤怒，而是悲傷和感恩
  - - 怎麼活
    - 品質比總量重要，但總量也算。留下能延續的成就，大多數時候他覺得有意義
