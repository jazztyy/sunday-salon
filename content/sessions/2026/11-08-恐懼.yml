    recall:
      - - 中性容器理論和有價值的容器理論差在哪裡？
        - 中性容器理論認為活著本身價值為零，好不好只看裡面裝了什麼（快樂、成就、知識、關係）。有價值的容器理論認為活著本身就有正的價值，算完內容之後還要再加分。Kagan 補充，有價值的是「以人的方式活著」，不是像一片草那樣活著。
      - - 容器理論的溫和版和驚人版差在哪裡？Kagan 站哪邊？
        - 溫和版：活著有價值，但內容夠糟時會被蓋過，總和可以是負的。驚人版：活著的價值大到無論內容多糟，總和永遠是正的，所以永生一定是好事。Kagan 覺得驚人版難以置信，有時被溫和版吸引，有時被中性版吸引。
      - - 「不可預測」為什麼讓死亡更糟？Kagan 用什麼圖說明人生的形狀重要？
        - 不知道還剩多少時間，就很難安排長期計畫和人生的高峰：可能讀完醫學院前就死了，也可能高峰來得太早，之後只是拖著。他畫了「白手起家」和「家道中落」兩條線：內容一樣多，幾乎每個人都寧可要先苦後甜的那一種。
