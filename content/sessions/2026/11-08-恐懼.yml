    recall:
      - - 恐懼要合理，需要哪三個條件？各舉一個不符合的例子。
        - 一、對象是壞的：怕有人送你冰淇淋不合理（除非你在節食）。二、機率不可忽略：怕被西伯利亞虎撕碎不合理（除非你是馴獸師）。三、要有不確定性：每天中午餅乾都會被偷、你也知道損失多少，可以生氣、難過，但害怕不合理。
      - - Kagan 怎麼分析「怕死」？
        - 怕死亡的過程：如果有機會痛苦地死，適度的恐懼合理。怕「死了」：每個人都確定會死，而且依剝奪說，死了只是好東西的缺席，不是該怕的那種壞。怕太早死：死亡時間不確定，所以有一點空間；但對健康的年輕人，機率很小，驚恐不合理。
      - - 為什麼 Kagan 認為對死亡生氣也不合理？他提出什麼替代的情緒？
        - 憤怒要對著一個行動者，而且對方要虧待了你。宇宙不是行動者；上帝是行動者，但就像室友給了你三顆糖、不給第四顆，並沒有虧待你。他認為合適的是悲傷，更是感恩：大多數原子根本沒機會活過，我們很幸運。
