args:
  - name: 驚人版容器理論
    kind: 生命的價值
    vid: xzS8QRYj6N8
    t: 1063
    ts: 講座 20 · 17:43
    prem:
      - - 以人的方式活著，本身就有正的價值，不只是裝好事壞事的容器。
        - null
        - Kagan 有時候被這個想法吸引。他把它限定在「人的生命」：像一片草那樣活著，或持續植物人狀態，他不覺得光是活著就有價值。
      - - 這份價值大到無論內容多糟，總和永遠是正的。
        - Kagan 覺得難以置信，所以叫它「驚人版」（fantastic，也有「荒唐」的意思）。他頂多接受溫和版：活著有價值，但內容夠糟時會被蓋過。
      - - 所以多活永遠比較好，就算永生會變得無聊、痛苦也一樣。
        - 這一步完全靠前提二。如果只接受溫和版，永生好不好就要看內容會糟到什麼程度；Kagan 認為終究會糟到蓋過活著本身的價值。
    concl: 永生永遠是好事，死亡永遠是壞事。
    verdict: Kagan 把容器理論分成中性版、溫和版、驚人版，只有驚人版能保證永生是好事。他認為就算採溫和版，永生終究還是不好。但這和「我們死得太早」並不衝突：在人生變糟之前就死，仍然是被剝奪了值得活的時間。
  - name: 從悲觀論推到自殺
    kind: 人的處境
    vid: J0TeUTzwI7k
    t: 1774
    ts: 講座 21 · 29:34
    prem:
      - - 「活著然後死去」整體是負的，從沒出生比較好。
        - Kagan 自己不同意，他認為對大多數人來說，出生還是比較好。不過這張卡要看的是：就算先接受這一步，結論推得出來嗎。
      - - 如果從沒出生比較好，正確的回應就是盡早結束生命。
        - 自殺不會讓你「沒出生過」，處境仍然是「活著然後死去」。如果「嘗一口就拿走」是壞事，自殺只是讓那一口更短；如果「高貴者的墜落」是壞事，自殺只是讓墜落提早。
    concl: 自殺是面對人的處境最合適的回應。
    verdict: Kagan 認為這在邏輯上推不出來，這是哲學上很誘人、但不成立的一步。他也說明，這不代表自殺永遠不合適；什麼時候合適，留到學期最後幾講。
  - name: 不看信封是不理性的
    kind: 面對死亡
    vid: J0TeUTzwI7k
    t: 2328
    ts: 講座 21 · 38:48
    prem:
      - - 想清楚死亡的事實，會改變我們怎麼活。
        - null
        - Kagan 接受。所以把死亡像州首府一樣丟到腦後才顯得奇怪。他也提到托爾斯泰《伊凡·伊里奇之死》，認為那篇小說就是在批評這種逃避。
      - - 明知某些事實會改變你的決定，卻選擇不看，是不理性的。例如室友手上關於約會對象的信封、驗過奶昔的報告。
        - Kagan 認為要分兩種情況：事實可能給你改變的「理由」，也可能只是「導致」你改變。親吻時想著對方的消化道會讓你親不下去，但那不是不該親的理由。如果只是原因，忽略它沒有問題。
    concl: 我們永遠不應該把死亡的事實放到一邊。
    verdict: Kagan 兩邊的大膽主張都不接受。「死亡的事實都只是原因，所以一律別想」不對；「應該永遠把死亡放在眼前」也不對。他的立場是看時間和場合，例如親吻時想著對方會變成屍體，就不是時候。真正的問題留到下一講：該想的時候，死亡給了我們什麼理由？
  - name: 怕死是不合理的
    kind: 情緒的合理性
    vid: 9iG_zA99QIc
    t: 1517
    ts: 講座 22 · 25:17
    prem:
      - - 恐懼要合理，需要三個條件：對象是壞的、發生的機率不可忽略、而且有不確定性（會不會發生，或會有多糟）。
        - Kagan 自己說第三個條件比較有爭議。他用每天被偷的餅乾、事先登報預告的竊賊、強度固定的電擊說明：確定會發生、也知道多糟時，合適的是憤怒或難過，不是恐懼。延伸：有人會舉排定日期的手術當反例，不過手術通常仍有「會有多痛」的不確定。
      - - 「死了」本身不是該怕的那種壞：依剝奪說，它只是好東西的缺席。就像吃完一支甜筒後沒有第二支，可惜，但不是該怕的事。
        - 這一步預設前半學期的物理主義和剝奪說。Kagan 自己指出，如果你相信死後可能下地獄、又不確定自己會不會去，恐懼就說得通。
