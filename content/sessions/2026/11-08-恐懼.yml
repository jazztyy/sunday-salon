title: 知道自己會死，該害怕嗎？又該怎麼活？
lede: 這週看 Kagan《死亡》課的第 20 到 23 講。第 20 講先補完「活著本身有沒有價值」，再和第 21 講一起看剝奪說之外，死亡還有哪些讓人難受的特徵。後兩講從「死亡是什麼」轉向「該怎麼回應」：怕死合理嗎？知道會死，又該怎麼活？
