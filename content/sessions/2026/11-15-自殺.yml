    recall:
      - - 什麼是「兩狀態要求」？Kagan 為什麼認為它該被放棄？
        - 說「X 讓你比較好」，要能比較之前和之後兩個狀態；死後不存在，沒有第二個狀態，所以「不如死」說不通。Kagan 指出，照這個要求，救了一個人生美好的人，也不能說幫了他。我們比較的其實是兩種人生：一百年的好人生比二十年的好，一百年的痛苦比三十年的糟。
      - - 容器理論怎麼影響「人生會不會不如沒有」？
        - 中性容器理論只看內容的好壞。有價值的容器理論認為活著本身就加分：溫和版的加分有限，內容夠糟還是可能低於零；極端版的加分無限大，所以人生永遠值得過，自殺永遠不會是理性的。Kagan 站在中間，認為要看個別情況。
      - - 在生命線的圖上，什麼情況下 Kagan 認為自殺「說得通」？什麼情況下說不通？
        - 說得通的情況：生命線接下來整體低於零，例如末期疾病；如果之後會失去行動能力，甚至可能要在還值得活的時候決定。說不通的情況：只是開始下滑但仍在零以上，或太早結束而丟掉一大段好人生。Kagan 特別強調，比以前差、比身邊的人差，都不等於不如沒有。
