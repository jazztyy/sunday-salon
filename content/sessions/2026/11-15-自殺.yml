tldr:
  - Kagan 把問題分成兩半：自殺什麼時候可能是<b>理性</b>的，什麼時候在<b>道德</b>上可以允許。兩者可能不一致，所以要分開看。
  - 有人說死後不存在，沒有第二個狀態可以比較，所以「他死了比較好」說不通。Kagan 認為如果這樣，連「救你一命是幫了你」也說不通，該放棄的是這個要求。
  - Kagan 認為理性的門檻很高：人生不只是變差，而是接下來整體<b>不如沒有</b>。只是變差、比別人差，都還不算。
  - 沒有水晶球、身在痛苦中，Kagan 認為這些都是要多想幾次、和醫生家人討論的理由，不是「永遠不能相信自己判斷」的理由。
  - 「違反上帝旨意」和「辜負生命這份禮物」兩個快速論證，Kagan 認為都不成立。效益主義和加上同意原則的義務論，都把他帶到同一個結論：有時可以，不是總是。
  - 最後一講回顧整學期：Kagan 認為沒有靈魂、不朽不值得要、恐懼死亡不是恰當的反應，並邀請學生「不帶恐懼、不帶幻想」地面對死亡。
stance:
  - - 「不如死」說得通嗎
    - 說得通。比較的是兩種可能的人生，不是兩個狀態；兩狀態要求應該放棄
  - - 自殺的理性
    - 在某些情況下可能是理性的，但門檻是人生接下來整體低於零。他說相當確定課堂上沒有人是這種情況
  - - 不確定與痛苦
    - 都是要謹慎、多想幾次的理由，不是永遠不能信任判斷的理由
  - - 自殺的道德
    - 效益主義或修正後的義務論，都推到「有時可以，不是總是」。遇到有人想結束生命，他認為應該寧可謹慎
  - - 整學期的結論
    - 沒有靈魂，人是會愛、會做夢的機器；不朽不值得要；死亡令人遺憾，但恐懼不是恰當的反應
