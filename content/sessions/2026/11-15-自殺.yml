    recall:
      - - 效益主義對自殺的結論是什麼？為什麼不是「永遠不行」，也不是「永遠可以」？
        - 有時可以，要看事實。說永遠不行，等於說自殺的後果永遠是壞的；說永遠可以，等於說後果永遠不壞，兩個經驗主張都不可信。要比較其他選項（例如有沒有治療方法），也要算對別人的影響，例如單親家長的孩子。
      - - 義務論為什麼一開始看起來會禁止自殺？Kagan 提出哪兩種修正？
        - 器官移植的例子顯示，殺害無辜的人是錯的，即使結果更好；我也是無辜的人。修正一：禁止的是讓人「整體上」更糟，就像截肢救命不算傷害。修正二：同意可以讓原本禁止的事變成允許，像拳擊比賽，以及撲向手榴彈救戰友。
      - - Kagan 說同意原則要加上哪些條件？他怎麼看待遇到想結束生命的人？
        - 同意要出於自由、知道後果、理智健全、有行為能力，可能還要有好理由；否則精神錯亂者或三歲小孩說「殺了我」也算數。遇到有人想結束生命時，他認為應該寧可謹慎，假設對方可能在痛苦中、沒有想清楚、沒有充分知情。
args:
  - name: 兩狀態要求
    kind: 「不如死」說得通嗎
    vid: VAVcgXYA4qY
    t: 432
    ts: 講座 24 · 07:12
    prem:
      - - 說「X 讓某人比較好」，必須能比較他之前的狀態和之後的狀態。
        - Kagan 認為這不是真正的要求。救了一個人生美好的人，我們說他因此受益，比較的是「長的好人生」和「短的好人生」兩種人生，不是兩個狀態。
      - - 死後不存在，而不存在不是任何一種狀態。
        - null
        - Kagan 接受。他明說自己不是主張不存在是一種「很薄、很詭異的狀態」。
      - - 所以死亡沒有第二個狀態可以比較。
        - null
        - 如果接受前兩步，這一步可以直接推出。問題出在第一步。
    concl: 「他死了會比較好」這句話根本說不通。
    verdict: Kagan 指出這個要求的代價：它也推出「你救了我，我並沒有因此變好」，被做心肺復甦救回來的人連謝謝都不該說。他認為這太難接受，所以放棄兩狀態要求。放棄之後，「不如死」至少說得通；但說得通不代表真的有這種情況，那要看採取哪一種幸福理論。
