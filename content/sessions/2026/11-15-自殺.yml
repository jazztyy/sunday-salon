  - name: 痛苦中的判斷不可信
    kind: 不確定下的決定
    vid: 2K3cF0z_lYY
    t: 1575
    ts: 講座 25 · 26:15
    prem:
      - - 會讓人生不如沒有的處境，幾乎一定伴隨極大的身體痛苦和情緒壓力。
        - null
        - Kagan 接受。他說要糟到這種程度，通常要有很多痛苦和失能，連看電視、和家人聊天都做不到。
      - - 在這種痛苦裡，人很難清楚思考。
        - null
        - Kagan 接受，也認為這正是要多想幾次、不倉促決定的理由。
      - - 在無法清楚思考時做的判斷，不可信任，不應該照著行動。
        - 手術的類比：在痛苦中的病人決定接受成功率極高的手術，同樣是在痛苦中判斷，沒有人會說他因此不能同意手術。而且不動手術也是一個決定，同樣是在痛苦中做的。
    concl: 自殺永遠不可能是理性的決定。
    verdict: Kagan 認為這是反對者最值得認真看待的論證，但他不接受。如果它在手術的例子裡不成立，他看不出為什麼換成自殺就突然成立。他的結論：痛苦中的判斷要多想幾次、不要倉促、和醫生和家人討論，但不等於永遠不能信任。
  - name: 違反上帝的旨意
    kind: 快速論證
    vid: 2K3cF0z_lYY
    t: 2317
    ts: 講座 25 · 38:37
    prem:
      - - 自殺打斷了生命原本的進程，所以違反上帝的旨意。
        - Kagan 引休謨：照這個說法，救人、做心肺復甦也打斷了進程，但沒有人說醫生不該救人。如果說救人也是上帝的旨意，那自殺一樣可以這樣說。沒有「使用手冊」，這個論證兩邊都切，給不出指引。
      - - 聖經就是那本使用手冊，而它禁止自殺。
        - 同一本書也說不可吃豬肉、不可穿混紡的衣服、悖逆的孩子要用石頭打死。只挑其中幾條遵守，代表其實是先有自己的道德判斷，再挑要接受的段落。
      - - 違反上帝旨意的行為是錯的。
        - null
        - Kagan 在這裡沒有挑戰這一步，只提醒它背後還有很多要另外檢查的假設：上帝存在嗎、我們有理由服從嗎。
    concl: 自殺在道德上是錯的。
    verdict: Kagan 說這比較像神學論證，他整學期盡量避開上帝存在與否的問題，但談自殺時繞不開。他的結論：至少在沒有使用手冊的情況下，訴諸上帝旨意沒辦法幫我們判斷自殺對不對。
  - name: 感恩論證
    kind: 快速論證
    vid: 2K3cF0z_lYY
    t: 2691
    ts: 講座 25 · 44:51
    prem:
      - - 別人送你禮物、幫你忙，你就欠他一份感恩。
        - null
        - Kagan 接受。他說感恩這種德行現在很少被討論，但他看不出有理由丟掉它。
      - - 生命是一份禮物，不管來自上帝、自然還是父母。
        - 只有真的是禮物，才會欠人情。人生如果已經糟到不如沒有，它更像霸凌者硬塞給你的爛派，而不是禮物。
      - - 報答這份禮物的方式，就是一直保有它；結束生命是拒絕禮物，是忘恩。
        - 霸凌者拿拳頭威脅你吃爛派，吃了也許明智，但沒有道德義務。如果上帝是好的，派壞了也不會堅持你繼續吃。
    concl: 自殺是忘恩，所以在道德上是錯的。
    verdict: Kagan 不懷疑感恩的義務，他質疑的是這個義務要求什麼。如果上帝用地獄威脅，不自殺也許是明智（prudent）的選擇，但那是審慎的考量，不是道德要求。他說如果自殺有什麼不道德之處，得靠更有系統的道德理論才找得出來。
