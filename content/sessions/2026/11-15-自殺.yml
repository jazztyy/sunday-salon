    vid: EiQshh9s768
    t: 519
    ts: 講座 26 · 08:39
    prem:
      - - 對錯只看後果：讓所有人的幸福盡量多、痛苦盡量少，每個人算一樣重。
        - 這是效益主義的主張。Kagan 指出大多數人認為後果不是唯一重要的事，這一點在後半講的器官移植例子會出現。
      - - 對本人來說，在人生不如沒有的情況下，死亡是好的結果，不是壞的。
        - null
        - Kagan 接受。死亡通常是壞的，因為它奪走一段值得過的人生；如果剩下的人生整體是負的，死亡就沒有奪走好東西。
      - - 對家人朋友的影響要一起算：可能很痛苦，也可能在只剩兩個選項時，認同結束痛苦比較好。
        - null
        - Kagan 接受，並強調要看事實。例如單親家長，孩子承受的傷害可能超過本人繼續活下去的痛苦。
    concl: 自殺有時在道德上可以，有時不行，要看事實。
    verdict: Kagan 說效益主義會得出溫和的結論：說自殺永遠不行，等於說後果永遠是壞的；說永遠可以，等於說後果永遠不壞，這兩個經驗主張他都認為不可信。他也提醒，有治療方法時，治療通常是後果更好的選擇。
  - name: 不可殺害無辜的人
    kind: 自殺的道德性
    vid: EiQshh9s768
    t: 1285
    ts: 講座 26 · 21:25
    prem:
      - - 殺害無辜的人是錯的，即使結果更好。例如不可以殺一個健康的人，用他的器官救五個病人。
        - Kagan 認為這條規則需要修正。修正一：禁止的是讓人「整體上」更糟，截肢救命不算違反。修正二：同意可以讓原本禁止的事變成允許，例如拳擊比賽，以及撲向手榴彈救戰友。
      - - 道德也管我怎麼對待自己，不只管我怎麼對待別人。
        - null
        - Kagan 接受。有人回應「道德只管別人」，他覺得不可信：我們不能為了更好的結果毀掉一個人，因為人不是物品；而我也是一個人。
      - - 自殺就是殺害一個無辜的人。
        - null
        - 字面上成立：我是一個人，而且是無辜的。
    concl: 自殺在道德上一律禁止。
    verdict: Kagan 認為同意原則不能無條件：有人在課後說「你可以殺我」，或精神錯亂、三歲小孩說「殺了我」，都不能讓殺人變成可以。但完全不要同意原則，撲向手榴彈的英雄就成了錯的。他的版本是有條件的同意：自由、知情、理智健全、有行為能力，可能還要有好理由。所以義務論也推到「有時可以，不是總是」。
argsNote: Kagan 說休謨在兩個半世紀前就回應了上帝旨意論證，指的是〈論自殺〉（Of Suicide，1777 年休謨死後出版）。休謨原文用的例子是讓河流改道、閃開落下的石頭，「救人也違反旨意」是 Kagan 的改寫，方向相同。Kagan 說「你也許認為聖經叫我們不可自殺」，但聖經其實沒有明文禁止自殺的經文，基督教傳統的反對主要來自奧古斯丁等人把「不可殺人」解釋成也包括殺死自己。「悖逆的孩子要用石頭打死」出自〈申命記〉21:18–21，原文是屢勸不聽的悖逆兒子，Kagan 說成「對父母無禮的青少年」是簡化。器官移植的例子是倫理學的經典案例，常見於 Philippa Foot、Judith Jarvis Thomson 的討論。效益主義和義務論各有很多版本，Kagan 只畫出大致輪廓，也提醒要深究得另修倫理學導論。
