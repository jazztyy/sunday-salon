tldr:
  - Kagan 把焦點放在死者本人。死亡不是<b>內在地</b>壞（不存在不會痛），而是<b>比較地</b>壞：它奪走本來能得到的人生好東西。這叫剝奪說，Kagan 認為基本上是對的。
  - 伊比鳩魯式的難題：死亡什麼時候對我壞？我不存在的時候，事情怎麼對我壞？Kagan 區分兩種「存在要求」，主張只要<b>曾經存在過</b>就夠了。這樣死亡對我是壞的，從未出生的 Larry 卻不必同情。
  - 盧克萊修問：出生前也有無限長的不存在，沒有人為它難過，為什麼要為死後難過？Kagan 檢查了「失去」、內格爾、費爾德曼、帕菲特的回答，認為都只是部分答案。
  - 接受剝奪說，不代表一定要說永生最好。好東西多到某個程度可能變成壞的，就像吃不完的巧克力。
  - Kagan 同意威廉斯：想不出任何值得<b>永遠</b>過的生活。避開無聊的辦法，不是把人變得像老鼠，就是讓那個人不再夠像自己。但他也認為多數人死得太早。
  - 講座 19 後半轉向「怎樣的人生過得好」。享樂主義說只有快樂和痛苦重要；Kagan 用諾齊克的經驗機器反駁它。
stance:
  - - 剝奪說
    - 基本上正確：死亡對死者最主要的壞處，是讓他得不到本來能得到的好東西。但他承認還有沒解決的難題
  - - 存在要求
    - 傾向溫和版：曾經存在過就夠了，不必和壞事同時存在。他也承認每個選項都有反直覺的地方
  - - 盧克萊修
    - 不確定哪個回答最好。常見的「死後是失去，出生前不是」只是替不對稱取名，不是解釋
  - - 永生
    - 同意威廉斯：沒有一種生活值得永遠過下去。但這不代表我們死得剛好，多數人死得太早
  - - 享樂主義
    - 不接受：快樂是好的、痛苦是壞的，但它們不是唯一重要的東西
