args:
  - name: 伊比鳩魯難題（一）：什麼時候壞
    kind: 死亡的壞處
    vid: 8V3zxvCkYfM
    t: 820
    ts: 講座 17 · 13:40
    prem:
      - - 每個事實都有它成立的時間。「我正在講課」現在成立，「我講過人格同一性」上個月成立。
        - Kagan 用 John 的例子質疑：我週一開槍，週二我死了，週三 John 死了。我殺了他，但說不出是哪一天殺的。也許有些事實就是沒辦法定時間。
      - - 死亡現在不對我壞，因為我還沒死。
        - null
        - Kagan 接受：我活著的時候，死亡還沒有剝奪我任何東西。
      - - 死亡在我死後也不對我壞，因為那時我不存在。
        - Kagan 認為可以替死亡定時間：我死後那段時間，我正得不到本來能得到的好東西，所以那段時間死亡對我壞。但這會引出下一個問題：我不存在時，事情怎麼能對我壞？
    concl: 「死亡對我是壞的」不是一個事實。
    verdict: Kagan 說伊比鳩魯那段話本身不太清楚，這只是一種讀法。兩條出路他都提了：否認每個事實都能定時間，或主張死亡在我死後對我壞。第二條路直接通到第二種讀法：存在要求。
  - name: 伊比鳩魯難題（二）：存在要求
    kind: 死亡的壞處
    vid: 8V3zxvCkYfM
    t: 1389
    ts: 講座 17 · 23:09
    prem:
      - - 某件事要對你壞（或好），你必須存在。
        - 要看是哪一種存在要求。強硬版要求你和壞事同時存在，會推出死亡不壞；完全放棄則得同情從未出生的 Larry。Kagan 改用溫和版：只要你在某個時候存在過就夠了。
      - - 你死了以後就不存在。
        - null
        - Kagan 在這段課假設物理主義：人死了就不再存在，也沒有像鬼魂一樣的存在方式。
    concl: 死亡不可能對你是壞的。
    verdict: Kagan 認為溫和版能兩邊都顧到：我存在過，所以死亡對我是壞的；Larry 從未存在，所以不必同情他。但講座 18 開頭他也指出溫和版的怪結果：把一個人的生命縮短到 1 秒，越短越壞；縮短到 0，讓他根本不出生，反而沒事。他說每個選項都不吸引人，只能選最不反直覺的。
  - name: 盧克萊修的對稱論證
    kind: 死亡的壞處
    vid: sGNDrKDDJiI
    t: 521
    ts: 講座 18 · 08:41
    prem:
      - - 出生前有一段無限長的時間，我不存在。
        - null
        - 沒有爭議。
      - - 沒有人為出生前的不存在難過，這是合理的。
        - 另一種回應是反過來：照剝奪說，出生前那段也是壞的。Kagan 用小行星的例子說明，如果明年世界毀滅，「要是早出生十年就能多活十年」是說得通的；想到這裡，他也覺得對稱也許才是對的。
      - - 出生前和死後兩段不存在沒有實質差別，應該同樣對待。
        - 多數哲學家挑這一步，想找出兩段可以不同對待的理由：死後是「失去」、出生時間是本質的（內格爾）、早出生只是平移不是延長（費爾德曼）、人本來就偏向在乎未來（帕菲特）。Kagan 認為每一個都只是部分答案。
    concl: 為死後的不存在難過也不合理。
    verdict: 盧克萊修把這當成論證：我們不該怕死。Kagan 說多數哲學家不願意接受這個結論，但要指出錯在哪裡並不容易。他對帕菲特的回應最有保留的是：就算我們天生偏向未來，那只是解釋，還不是這種態度合理的理由。他的結論是：不清楚最好的答案是什麼。
  - name: 剝奪說推出永生最好？
    kind: 永生
    vid: sGNDrKDDJiI
    t: 2021
    ts: 講座 18 · 33:41
    prem:
      - - 死亡壞在讓我得不到人生的好東西。
        - null
        - 這就是剝奪說，Kagan 接受它。
      - - 不管我什麼時候死，多活一段都會得到更多好東西。
        - 不一定。好東西的量多到某個程度，可能變成壞的，就像吃到第一百塊巧克力。如果之後的人生整體是壞的，死亡就沒有剝奪任何好東西，甚至是好事。
    concl: 永遠不死最好。
    verdict: Kagan 把問題分成兩個：邏輯上，接受剝奪說的人一定要說永生好嗎？不必。實際上，永生到底好不好？這要另外問。他接著用史威夫特、天堂和威廉斯的例子處理第二個問題。
  - name: 永生的兩難
    kind: 永生
    vid: ls_t2M1c0tY
    t: 1077
    ts: 講座 19 · 17:57
    prem:
      - - 永生是真的「永遠」，不是活一千年或一百萬年。
        - null
        - 這是問題的定義。Kagan 一再提醒，重點在「永遠」。
      - - 如果永生的人一直像現在的我，任何活動遲早都會無聊：泰國菜、填字遊戲、數學、哲學，甚至和上帝的對話。
        - Kagan 自己承認，也許只是他的想像力不夠。這一步靠的是個人的想像測試，不是證明。學界也有人反駁，認為有些快樂可以一再重複而不膩（延伸）。
      - - 用快樂拉桿或切除額葉來避免無聊，等於把我變得像老鼠，現在的我不想要這樣。
        - null
        - Kagan 認為問題是「現在的你想不想要」，不是「改造後的那個人會不會快樂」。被改造後也許會一直快樂，但這對現在的他是懲罰，不是禮物。
      - - 用漸進失憶和性格大改來避免無聊，那個人雖然還是我，卻不夠像我，我不在乎他活著。
        - 這一步依賴 Kagan 在人格同一性單元的看法（瑪土撒拉的例子）：存活時在乎的不只是「是我」，還要「夠像我」。認為只要是同一個人就值得的人，不會接受這一步。
    concl: 沒有一種永生是值得要的。
    verdict: Kagan 同意威廉斯：永生是噩夢，不是禮物。但他強調這不代表我們死得剛好。活到 50、80、100 歲，還遠遠沒把人生的好東西用完。他認為最好的是能活到自己覺得夠了為止，就像巴恩斯想像的天堂。
