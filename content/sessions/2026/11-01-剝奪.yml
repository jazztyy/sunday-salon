        - null
        - 這是思想實驗的設定。Kagan 特別排除《駭客任務》式的擔心：沒有人在騙你，每個人都接著最好的機器。
      - - 如果享樂主義對，接上機器的人生就是最好的人生，不缺任何東西。
        - null
        - Kagan 認為享樂主義者只能這樣回答：機器已經給了快樂和經驗，照假設那就是福祉的全部。
      - - 但多數人（包括 Kagan）不想一輩子接上這台機器。
        - 這是直覺，不是證明。Kagan 只是猜「大部分人」會說不要。學界有人認為這個直覺受到現狀偏誤或對機器的不信任影響（延伸）。
    concl: 享樂主義錯了：好的人生不只是內在感受對。
    verdict: Kagan 說他不是認為快樂不好、痛苦不壞，而是不認為它們是唯一重要的東西。經驗機器把「內在」都做對了，如果還是不夠，就表示好的人生還需要別的東西。那是什麼，留到下一講。
argsNote: 伊比鳩魯那段話出自〈致美諾寇信〉（Letter to Menoeceus）。Kagan 明說原文不太清楚，「時間難題」和「存在要求」是他提出的兩種讀法，不是伊比鳩魯的原話；伊比鳩魯自己的脈絡是：死亡就是感覺的終止，而好壞都在感覺之中。盧克萊修的論證出自《物性論》第三卷，Kagan 說他的版本「不是直接引用」；原文用的是鏡子的比喻：出生前的時間是自然拿給我們看的、死後時間的鏡子。內格爾在〈死亡〉（Death）一文的註腳裡，自己也提過類似 Kagan 的反例，並承認這個回答不完全令人滿意。威廉斯的原文是〈Makropulos 案例〉，他的論證依賴「定言慾望」（categorical desires）這個概念，Kagan 的版本把重點放在無聊；這個論證至今仍有爭議。經驗機器出自諾齊克《無政府、國家與烏托邦》。
