    recall:
      - - 「內在地壞」和「比較地壞」有什麼差別？不存在屬於哪一種？
        - 內在地壞是本身就壞，例如頭痛。比較地壞是因為錯過了更好的東西，例如拿到 10 元的信封，另一個信封裡有 1000 元。Kagan 認為不存在不會痛，所以不是內在地壞，只是比較地壞。
      - - 伊比鳩魯那段話，Kagan 提出哪兩種讀法？
        - 一、時間難題：每個事實都要有成立的時間，但死亡在我活著時、死了之後都不對我壞。二、存在要求：某件事要對你壞，你必須存在；死後你不存在，所以死亡對你不壞。
      - - 為什麼完全放棄存在要求會出問題？Kagan 怎麼解決？
        - 放棄之後，從未出生的 Larry 也被剝奪了人生，而這樣的可能之人有 10 的 33 次方以上，就得說這是史上最大的道德悲劇。Kagan 改用溫和版：只要曾經存在過，事情就能對你壞。我存在過，Larry 從未存在。
