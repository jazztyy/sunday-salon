lede: 這週看 Kagan《死亡》課的第 17 到 19 講。他先提出剝奪說：死亡壞在奪走本來能得到的好東西，再逐一處理伊比鳩魯和盧克萊修留下的難題。接著問：如果死亡是壞的，永遠不死會比較好嗎？最後轉向新的問題：怎樣的人生才算過得好。
