    recall:
      - - 盧克萊修的對稱論證怎麼說？哲學家可以怎麼回應？
        - 出生前有無限長的不存在，沒有人為它難過，所以也不該為死後的不存在難過。回應有三種：同意他；說兩段都是壞的；或找出理由說明兩段可以不同對待。多數哲學家選第三種。
      - - 內格爾和費爾德曼怎麼解釋不對稱？Kagan 各用什麼例子質疑？
        - 內格爾：出生的時間是本質的，更早出生的會是另一個人。Kagan 舉冷凍精卵的例子：同一對精卵早十年結合，還是同一個人。費爾德曼：想像早出生時，我們只是把整段人生平移，不是變長。Kagan 舉小行星的例子：如果世界明年毀滅，早出生十年就真的多活十年。
      - - 接受剝奪說，邏輯上一定要說永生是好的嗎？
        - 不一定。剝奪說只說死亡在奪走好東西時才是壞的。如果之後的人生整體是壞的，死亡就不壞。就像巧克力，前幾塊很好，第一百塊不一定。邏輯不強迫，但永生實際上好不好是另一個問題。
