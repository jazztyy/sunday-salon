tldr:
  - 身體理論：同一個身體就是同一個人。Kagan 認為最好的版本是<b>跟著腦走</b>：換腦手術其實是另一個人換了一副軀幹。
  - 人格理論：同一個逐漸演變的人格（信念、慾望、記憶、目標）就是同一個人。物理主義者和相信靈魂的人，都可以接受這兩種理論。
  - 身體理論下，肉身復活要看「拆開再組回去」還算不算原來那個。送修的手錶像是同一隻，重搭的積木塔卻不像，Kagan 說他不知道差別在哪。
  - Williams 的兩個故事其實是同一個心靈互換案例，換個說法，直覺就從人格理論倒向身體理論。Kagan 認為光靠這種直覺無法決定。
  - 複製和分裂讓兩個理論都得加上<b>不分支規則</b>：只有沒有競爭者時，才算同一個人。Kagan 覺得這很難相信，但兩邊都逃不掉。
  - 講座 13 的轉折：「我能不能存活」和「存活之中什麼重要」是兩個問題。Kagan 認為記憶、性格全部洗掉的存活，就算算是他，也不是他要的。
stance:
  - - 身體還是人格
    - 在兩者之間來回過。現在傾向身體理論（跟著腦走，加上不分支規則），但說自己沒有更多論證能定案
  - - 不分支規則
    - 很難相信：我是不是我，不該取決於別處有沒有複製品。但身體理論和人格理論都需要它，也許只能接受
  - - 靈魂理論
    - 不相信靈魂。他指出，如果靈魂不能分裂，靈魂理論可以避開分支問題，代價是削弱支持靈魂存在的論證
  - - 肉身復活
    - 在身體理論下至少是融貫的可能，但他不知道重組的身體算不算原來那個，也不表示自己相信會有審判日
  - - 什麼重要
    - 只有存活不夠，他想要的是帶著同樣的人格存活。重要的是不是就是人格，留到下一講
