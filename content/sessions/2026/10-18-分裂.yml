    recall:
      - - Williams 的兩個故事各引出什麼直覺？Kagan 為什麼說它們幫不上忙？
        - 故事一：心靈互換後，Kagan 希望折磨的是「他的身體、Linda 的人格」那個，支持人格理論。故事二：先失憶、再被灌入 Linda 的記憶，他還是不想被折磨，支持身體理論。但兩個故事的結局完全一樣，只是強調不同細節，所以直覺無法決定哪個理論對。
      - - 拿破崙異議有哪兩個版本？Kagan 怎麼回應？
        - 只有「我是拿破崙」一個信念的病人，沒有拿破崙的整體人格，人格理論本來就不說他是拿破崙。如果他有拿破崙完整的記憶和人格，Kagan 傾向承認他可能就是拿破崙；堅持記憶是假的，等於已經預設人格理論錯了。
      - - 兩個拿破崙同時出現時，有哪幾個選項？人格理論最後怎麼修正？
        - 只有密西根那個是、只有紐約那個是（沒有理由偏袒一個）、兩個都是（一個人同時在兩地）、兩個都不是。Kagan 認為「都不是」最不糟，但這推翻原始的人格理論。修正版加上不分支規則：有我的人格、而且只有一個人有，才是我。
