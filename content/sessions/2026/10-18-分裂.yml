      - - 這樣的存活，和只有一塊指節骨被移植到別人身上延續下去差不多：就算算是我，誰在乎？
        - null
        - Kagan 說指節骨理論很蠢，靈魂理論不蠢，但洗乾淨的靈魂延續一樣給不了他想要的東西。他邀請聽眾自己檢查有沒有同感。
      - - 身體理論也一樣：腦被完全、不可逆地洗掉，醒來的「無名氏」依理論是我，但這對我沒有安慰。
        - null
        - Kagan 用同樣的方式處理身體理論，結果相同。
    concl: 我在乎的不只是存活，而是帶著同樣的人格存活。
    verdict: Kagan 認為「我能不能存活」和「存活之中什麼重要」可以分開。這也是他說「身體理論可能對，但不太重要」的原因。重要的是不是就是「同一個人格」，他留到下一講處理。
argsNote: 心靈互換的兩個故事出自 Bernard Williams〈自我與未來〉（The Self and the Future，1970），原文同樣用同一個案例的兩種說法顯示直覺互相衝突。積木塔的例子出自 Peter van Inwagen 討論肉身復活的文章；van Inwagen 本人是基督徒，他的出路是推測上帝可能在死亡時保存了原本的身體，Kagan 沒有提到。「存活之中什麼才重要」以及分裂案例、不分支條件，一般歸給 Derek Parfit《理與人》（Reasons and Persons，1984）和更早的 David Wiggins，Kagan 這幾講沒有提名字。Kagan 也說明，真實的腦左右半球並沒有完全重複，「半個腦就夠」是為了思想實驗的假設。講座 13 的中文標題「怎麼活才有意義」是轉載者的譯法；這一講談的是存活之中什麼重要（what matters in survival），不是人生意義。
