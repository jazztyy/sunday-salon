  - name: 積木塔與肉身復活
    kind: 反例
    vid: BwZLGESyTs8
    t: 600
    ts: 講座 11 · 10:00
    prem:
      - - 依身體理論，同一個身體就是同一個人。
        - null
        - 這是身體理論本身的主張，論證接受它，再看它對復活有什麼影響。
      - - 審判日的肉身復活，就是上帝把散落的分子照原樣組回去。
        - null
        - Kagan 用這個方式理解肉身復活，並提到早期基督徒相信類似的身體理論與肉身復活。
      - - 一個東西拆開再照原樣組回去，得到的不是原來那個東西，只是複製品。兒子搭的積木塔被撞倒，照原樣重搭，就不是兒子搭的那座。
        - 送修的手錶也是拆開、清洗、照原樣組回，Kagan 覺得那還是他的錶。他對積木塔的直覺和 van Inwagen 一樣，但兩個例子方向相反，他說不出差別在哪。
    concl: 復活的身體不是原來的身體，所以醒來的不是我，只是我的複製品。
    verdict: Kagan 沒有下定論。他傾向「錶是同一隻、塔不是同一座」，但沒有好理論說明差別，所以無法判斷重組的身體比較像哪一個。他的結論只是：在身體理論下，肉身復活看起來仍是融貫的可能，還有形上學的工作要做。他也說明這不表示他相信會有審判日。
  - name: 身體理論最好的版本：跟著腦走
    kind: 人格同一性
    vid: BwZLGESyTs8
    t: 1315
    ts: 講座 11 · 21:55
    prem:
      - - 身體有些部分可以改變或失去：減重、曬傷脫皮、路克被砍斷一隻手，都還是同一個人。
        - null
        - Kagan 用這些例子說明，同一個身體本來就容許部分改變，就像方向盤會磨掉原子。
      - - 腦不一樣：路克的腦被毀掉、換上一顆替代的腦，就不再是路克。
        - null
        - Kagan 認為我們的直覺確實如此。他用一段律師詰問驗屍醫生的笑話說明：腦都在罐子裡了，人不可能還活著。
      - - 腦之所以重要，是因為它承載人格：信念、慾望、記憶、目標。
        - 這一步反而打開了另一條路。Kagan 自己接著問：如果真正重要的是人格，為什麼不直接說人格才是同一性的關鍵？這就是人格理論。
    concl: 同一個腦（夠保住人格的那部分）就是同一個人。換腦手術其實是另一個人換了一副軀幹。
    verdict: Kagan 認為這是身體理論最有希望的版本，但不是所有身體理論者都同意；他說指定閱讀 Perry 對話錄的主角就主張跟著軀幹走。他也指出，若一個半腦就夠保住人格，這個版本會碰上「兩個半腦分別移植」的問題，這留到講座 13。
  - name: Williams 的兩個故事
    kind: 思想實驗
    vid: 9ZWpsPah9EQ
    t: 168
    ts: 講座 12 · 02:48
    prem:
      - - 想知道哪一個是「我」，可以問：從自利的第一人稱角度，我最不希望哪一個被折磨。
        - null
        - Kagan 用這個方法引出直覺，並提醒要先擱置「不希望任何人被折磨」的道德考量。
      - - 故事一：瘋狂科學家互換你和 Linda 的記憶、信念和慾望。Kagan 希望被折磨的是「他的身體、Linda 的人格」那個，這支持人格理論。
        - null
        - Kagan 說這確實是他的直覺：有他記憶、擔心怎麼向太太解釋的那個，才是他。
      - - 故事二：科學家先讓你完全失憶，再讓你以為自己是 Linda，然後折磨你。Kagan 還是不希望被折磨，這支持身體理論。
        - null
        - Kagan 說這也是他的直覺：失憶加發瘋不會讓被折磨變得比較好。
      - - 這些直覺可以告訴我們，身體理論和人格理論哪個正確。
        - 兩個故事其實是同一個案例：結局都是 Kagan 的身體配 Linda 的人格、Linda 的身體配 Kagan 的人格。只是強調的細節不同，直覺就跟著翻轉。
    concl: 用思想實驗的直覺，就能在身體理論和人格理論之間做選擇。
    verdict: Kagan 認為這個方法在這裡失靈：同一個故事講兩次，他會被拉向兩邊，所以需要別的論證。學生提出「被改寫的腦已經變成 Kagan 的腦」，Kagan 不同意：科學家只是重新寫入資料，就像清空硬碟、裝進另一台電腦的程式和檔案，電腦還是原來那台。
  - name: 兩個拿破崙
    kind: 複製
    vid: 9ZWpsPah9EQ
    t: 1978
    ts: 講座 12 · 32:58
    prem:
      - - 依人格理論，只要有拿破崙完整的人格，就是拿破崙。
        - 這是原始版本。Kagan 接著提出的修正版加上不分支規則：有拿破崙的人格、而且只有一個人有，才是拿破崙。
      - - 如果拿破崙的人格能在密西根的某人身上醒來，也就能同時在紐約和密西根各醒來一個。
        - null
        - Kagan 接受：人格像程式和資料，原則上可以複製。
      - - 說其中一個是拿破崙、另一個不是，沒有任何理由。
        - null
        - 兩人的條件完全對等，偏袒任何一邊都說不過去。
      - - 也不能說兩個都是：一個人不能同時在兩個地方，不能是 Y 字形的時空蟲。
        - null
        - Kagan 接受，但說得很保留：這是我們對人的基本形上看法，有人也許願意放棄它，他自己覺得代價太大。
    concl: 兩個都不是拿破崙。所以人格理論是錯的。
    verdict: Kagan 認為「兩個都不是」是最不糟的選項，因此原始的人格理論必須放棄。但人格理論者可以修正：加上不分支規則，只有一個人有拿破崙的人格時，他才是拿破崙；分支時，兩個都不是。修正版付出的代價，是下一張卡片的問題。
