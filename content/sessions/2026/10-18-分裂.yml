    recall:
      - - 手錶和積木塔兩個例子，各引出什麼直覺？這對肉身復活有什麼影響？
        - 送修的手錶拆開清洗、照原樣組回，Kagan 覺得還是他的錶。van Inwagen 的積木塔被撞倒後照原樣重搭，Kagan 覺得那不是兒子搭的塔，只是複製品。如果重組的身體像積木塔，審判日復活的就只是複製品。Kagan 說不出兩個例子的差別，所以無法判斷。
      - - 為什麼 Kagan 認為身體理論最好的版本是「跟著腦走」？
        - 失去手、手臂、甚至四肢，都還是路克；腦被毀掉、換上別的腦，就不是了。腦是承載人格（信念、慾望、記憶）的部分。所以換腦手術其實是另一個人換了軀幹；也不必是整顆腦，夠保住人格的部分就行。
      - - 人格理論怎麼回應「記憶和慾望一直在變」？
        - 不要求每一項都相同，只要逐漸演變、有重疊和延續。就像一條繩子，沒有一根纖維貫穿全長，仍然是同一條繩子；從中間剪掉一段，才變成兩條。
