    recall:
      - - 左右半腦分裂的案例，怎麼讓身體理論陷入和人格理論一樣的困境？
        - Lefty 和 Righty 各有一半 Kagan 的腦，都夠保住人格，身體理論沒有理由選其中一個；兩個都是，就變成一個人同時在兩地；兩個都不是，就違反了身體理論。最好的出路也是加上不分支規則。
      - - 靈魂理論怎麼面對分裂案例？
        - 如果靈魂也能分裂，它和其他理論一樣需要不分支規則。如果靈魂不能分裂，只有拿到靈魂的那個是 Kagan，不必加規則；但從外面和裡面都分辨不出是哪一個，而且沒拿到靈魂的那個仍有意識和人格，削弱了「需要靈魂才能解釋人」的論證。
      - - Kagan 怎麼把「我能不能存活」和「什麼重要」分開？
        - 假設靈魂理論對，而靈魂轉世時被洗得一乾二淨；或假設身體理論對，而腦被完全、不可逆地洗掉。依理論那都是他，但他會說「誰在乎」，就像只有一塊指節骨延續下去。他想要的是帶著同樣的人格存活。
