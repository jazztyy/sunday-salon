args:
  - name: 回收＋回憶的組合
    kind: 《斐多篇》
    vid: 0-9OA0EmpsM
    t: 223
    ts: 講座 8 · 03:43
    prem:
      - - 靈魂在出生前就已經存在（回憶說）。
        - Kagan 不接受回憶說：被不完美的東西「提醒」完美的形式，也可能是今生才第一次認識形式。不完美的東西像一封介紹信，第一次把我們的心靈引向形式。
      - - 東西毀壞時，先前就存在的零件會留下來（回收論證）。
        - 汽車引擎是造車前就存在的零件，但車毀了，引擎可能一起毀；就算留下來，最後也會分解成原子。「有些零件會留下來」推不出「每個零件都永遠存在」。
    concl: 靈魂在我們死後也會繼續存在。
    verdict: 西米亞斯和克貝指出，回憶說最多只證明靈魂在出生前存在，而大家真正想知道的是死後。蘇格拉底把兩個論證接起來回應，但 Kagan 認為就算前提都給柏拉圖，也只能得到「靈魂比身體早存在」。要證明不朽，需要的是靈魂本身不會被摧毀，這正是下一個論證要做的事。
  - name: 論證四：單純性論證
    kind: 《斐多篇》
    vid: 0-9OA0EmpsM
    t: 620
    ts: 講座 8 · 10:20
    prem:
      - - 只有組合物（有部分的東西）才會被摧毀。撕紙、折粉筆，都是把它的部分拆開。
        - Kagan 在講座 9 補充：沒有部分的東西確實拆不開，但邏輯上仍然可能直接消失。如果上帝能說「要有單純物」，也就能讓它不再存在。
      - - 只有會變化的東西才是組合物。彎一根鐵條，就是重新排列它的部分。
        - null
        - Kagan 沒有挑戰這一步。變化可以理解成部分之間重新排列。
      - - 不可見的東西不會變化，所以不會被摧毀。數字 3 看不見，也永遠是奇數。
        - 要看「不可見」是什麼意思。如果是「看不見」，豎琴的和諧看不見，卻會被摧毀；如果是「五感都感覺不到」，無線電波感覺不到，也會被摧毀。另外，靈魂本身好像一直在變：今天相信天氣熱，明天相信天氣冷。
      - - 靈魂是不可見的。
        - 如果把「不可見」改成「完全偵測不到」，無線電波不再是反例（收音機偵測得到），但靈魂也不再算不可見：朋友的身體在跟你討論哲學，你就偵測到他的靈魂了。
    concl: 靈魂不會被摧毀，所以不朽。
    verdict: Kagan 認為這是柏拉圖最值得認真看的論證之一，難在不容易指出錯在哪裡。但「不可見」不管取哪一種意思，總有一個前提不成立。另外，蘇格拉底自己的結論只是「不可摧毀，或幾乎如此」，克貝因此用大衣的比喻質疑「幾乎」不夠；Kagan 認為如果前提成立，本來就能得出更強的結論。
  - name: 柏拉圖對和諧比喻的反駁
    kind: 反駁物理主義
    vid: Vod5mS5YuA8
    t: 505
    ts: 講座 9 · 08:25
    prem:
      - - 和諧不能先於豎琴存在，但靈魂先於身體存在。
        - 這一步要靠回憶說，Kagan 認為回憶說不成立。他同意：如果靈魂真的先於身體存在，它就不會像和諧。
      - - 和諧有程度之分，但靈魂沒有：你要嘛有靈魂，要嘛沒有。
        - 心靈的能力也有程度之分：智力、創造力、講理的程度、溝通能力都有高低。
      - - 好的靈魂可以說是「和諧的」；如果靈魂就是和諧，就得說「和諧的和諧」，這說不通。
        - 這只是比喻，不必凡是心靈有的特徵和諧都要有。而且和諧也分種類，有的甜美、有的刺耳，正好對應心靈的好壞。
      - - 和諧不能反過來指揮豎琴，靈魂卻能指揮、甚至反抗身體：身體想吃蛋糕，靈魂說不行，在節食。
        - 物理主義者會說，這其實是身體的一部分（大腦）影響另一部分（手指的肌肉）。豎琴也有粗略的類比：撥一根弦，會帶動其他弦一起共振。
    concl: 心靈不像身體的和諧，所以物理主義是錯的。
    verdict: Kagan 認為「心靈之於身體，就像和諧之於豎琴」是早期的物理主義：心靈是身體運作良好時能做的事。他肯定柏拉圖認真面對這個對手，用當時的樂器思考很合理；但四個反駁都不成立。他也指出，這些反駁就算成立，也救不了單純性論證：西米亞斯只需要「和諧不可見又會被摧毀」這一點。
  - name: 論證五：本質屬性
    kind: 《斐多篇》
    vid: Vod5mS5YuA8
    t: 1524
    ts: 講座 9 · 25:24
    prem:
      - - 活著（能夠思考）是靈魂的本質屬性，就像熱是火的本質屬性：不可能有冷的火。
        - null
        - Kagan 覺得相當合理：一個連思考能力都沒有的心靈，就不算心靈了。重點在「能夠」，睡著沒在想的心靈仍然能思考。
      - - 所以靈魂是「不死的」。
        - 「不死」有兩種意思。A：不會有一個存在卻是死的靈魂。B：靈魂不會被摧毀。前提一只推得出 A。火一定是熱的，不代表火不會被熄滅。
      - - 不死的東西不會死，也就是不會被摧毀。
        - null
        - 如果「不死」指的是意思 B，這一步沒有問題。問題出在前一步：從意思 A 偷偷換成了意思 B。
    concl: 靈魂不會被摧毀，會永遠存在並能夠思考。
    verdict: Kagan 認為柏拉圖在兩種「不死」之間來回。有靈魂的地方就有生命，但這不代表靈魂不會消失，就像有火的地方就有熱，火還是會熄。他也提醒，哪些屬性算「本質屬性」至今仍有爭議，例如水是否必然是 H₂O。
  - name: 洛克對靈魂理論的質疑
    kind: 人格同一性
    vid: 7NLjMj__sB8
    t: 2599
    ts: 講座 10 · 43:19
    prem:
      - - 根據靈魂理論，同一個靈魂就是同一個人；換了靈魂，就是另一個人。
        - null
        - 這是靈魂理論本身的主張，論證接受它，再看它會推出什麼。
      - - 靈魂看不見。如果半夜被換成新的靈魂，而新靈魂保有所有記憶、信念和慾望，沒有任何方法分辨。
        - null
        - Kagan 接受：檢查記憶、信念都沒用，因為依靈魂理論，那些不是同一性的關鍵，而靈魂本身看不到。
      - - 一個理論如果讓我們完全無法知道自己有沒有活過昨晚（甚至可能每分鐘都換一次），就不可信。
        - Kagan 指出這不是邏輯矛盾，靈魂理論者可以選擇接受這個結果。洛克只是認為代價太大，要不要接受得自己判斷。
    concl: 就算靈魂存在，它也不是人格同一性的關鍵。
    verdict: 這個論證不是在否認靈魂存在，而是說即使有靈魂，也不該用它判斷是不是同一個人。Kagan 下一講會接著找其他的「黏合劑」。另外，洛克在《人類理解論》第二卷第 27 章的原始討論，重點是主張人格同一性在於意識的延續，而不在於是不是同一個實體；「每分鐘換一次靈魂」是 Kagan 的改寫。
argsNote: 論證四、五的編號接續上一場，依照 Kagan 上課的重建方式。「單純性論證」對應原文的「親緣論證」段落（78b–80b，「不可見」的引文在 79a）；「本質屬性論證」對應原文最後一個論證（102a–107a）。Kagan 說蘇格拉底沒有回應克貝的大衣質疑；不過一般的讀法認為，原文後段關於原因的長篇討論和最後一個論證，就是對克貝的回答，Kagan 自己也猜這是柏拉圖再提一個論證的原因。
