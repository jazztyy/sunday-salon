      - - 把回憶說和回收論證接在一起，為什麼還是推不出靈魂不朽？Kagan 用什麼例子？
        - 汽車引擎是造車前就存在的零件，車毀了它可能跟著毀；就算留下來，最後也會分解。「出生前就存在」推不出「永遠存在」，要證明的是靈魂本身不會被摧毀。
      - - 單純性論證怎麼從「不可見」推到「不會被摧毀」？
        - 只有組合物（有部分的東西）會被摧毀；只有會變化的東西才是組合物；不可見的東西不會變化，所以不會被摧毀。靈魂不可見，所以靈魂不會被摧毀。
      - - 「不可見」的三種意思，各遇到什麼問題？
        - 看不見：和諧看不見卻會被摧毀。五感都感覺不到：無線電波感覺不到卻會被摧毀。完全偵測不到：無線電波不再是反例，但靈魂也不再算不可見，因為可以透過朋友的身體在跟你討論哲學，偵測到他的靈魂。
