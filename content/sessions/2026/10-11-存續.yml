tldr:
  - 《斐多篇》最後兩個論證：單純性論證（沒有部分就拆不掉）和本質屬性論證（靈魂本質上是活的）。Kagan 認為兩個都不成立。
  - 單純性論證卡在「不可見」這個詞：看不見、五感感覺不到、完全偵測不到，不管取哪一種意思，總有一個前提出問題。
  - 西米亞斯說心靈之於身體，就像和諧之於豎琴。Kagan 認為這是早期的物理主義，而柏拉圖的四個反駁都擋不住它。
  - Kagan 的結論：沒有好理由相信靈魂，所以他認為沒有靈魂。他說不必證明靈魂<b>不可能</b>存在，就像不必搜遍每個山洞才能不相信龍。
  - 講座 10 轉向第二個大問題：怎樣才算「同一個人」？問的不是兩個階段像不像，而是它們是不是同一條<b>時空蟲</b>。
  - 靈魂理論說：同一個靈魂就是同一個人。洛克的質疑是：如果靈魂每晚被換掉、記憶全部保留，你永遠不會知道。
stance:
  - - 靈魂
    - 沒有足夠好的理由相信靈魂存在，所以他認為沒有靈魂。之後的課都從物理主義出發
  - - 舉證責任
    - 不必證明靈魂不可能存在，只要逐一駁倒支持的論證就夠了。他也不認為靈魂的概念自相矛盾
  - - 對柏拉圖
    - 很尊重：認為單純性論證值得認真看，和諧比喻是在認真面對物理主義
  - - 人格同一性
    - 先把問題問對：問的是整個跨越時間的人，不是某一刻的樣子。答案留到下一講
