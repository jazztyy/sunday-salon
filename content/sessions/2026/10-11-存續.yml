      - - Kagan 為什麼說不必證明靈魂不存在，也能合理地不相信靈魂？
        - 我們不相信龍和獨角獸，不是因為搜遍了每個山洞，而是因為支持牠們存在的證據都被解釋掉了。證明「不可能存在」是額外加分，不是必要條件。
