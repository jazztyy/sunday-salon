    recall:
      - - 柏拉圖反對「心靈像身體的和諧」的四個理由是什麼？Kagan 怎麼回應？
        - 一、和諧不能先於豎琴存在，靈魂卻先於身體（要靠回憶說，Kagan 不接受）。二、和諧有程度之分，靈魂沒有（但智力、創造力都有程度）。三、靈魂可以和諧，難道要說「和諧的和諧」（這只是比喻，和諧也有甜美與刺耳之分）。四、靈魂能反抗身體（其實是大腦這部分影響身體其他部分，就像一根弦帶動其他弦共振）。
      - - 本質屬性論證裡，「不死」有哪兩種意思？論證錯在哪裡？
