title: 死亡到底是什麼？我們真的相信自己會死嗎？
lede: 這週看 Kagan《死亡》課的第 14 到 16 講。先收尾上一場的問題：存活中真正重要的是什麼。接著從物理主義出發問死亡是什麼，再檢查三個常見說法：沒有人真的相信自己會死、每個人都孤獨地死去、死亡只對活著的人是壞的。第 16 講後半，課程從形上學轉向價值問題。
speaker: Shelly Kagan（耶魯大學哲學系）
