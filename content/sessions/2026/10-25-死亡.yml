      - - 瑪土撒拉的例子想說明什麼？
        - 依人格理論，只要人格是慢慢演變的，969 歲的那個人仍然是 Kagan。但他不記得童年，興趣和價值觀都完全不同。Kagan 說：就算是我，又怎樣？他要的是有一個和他相似的人。
      - - 依身體觀，我死後還存在嗎？Kagan 怎麼形容這個結果？
        - 存在，至少一陣子：屍體就是我的身體。他說好消息是你死後還存在，壞消息是你會是一具屍體。這說明光是存在不夠，他要的是活著，而且是一個人。
      - - 在階段 D（身體還活著，P 功能已經沒了），身體觀和人格觀各怎麼說？
        - 身體觀：我還活著，但不再是人，所以「是人」不是我的本質屬性。人格觀：我已經不存在，也不算活著，但我的身體還活著，所以要區分「我的死」和「我身體的死」。
