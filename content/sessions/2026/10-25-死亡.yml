        - Kagan 明說不想貶低這種痛苦，它確實是死亡很壞的一面。Klopstock 的詩〈分離〉說的就是這件事。
      - - 這種分離就是死亡最核心的壞處。
        - 故事一：朋友搭太空船遠行，一百年後才回來，起飛後完全無法通訊。故事二：太空船起飛後爆炸，朋友死了。兩者的分離一樣，故事二卻更糟，多出來的壞處不是分離。
    concl: 死亡主要是對活著的人壞，而不是對死者壞。
    verdict: Kagan 認為故事二對我更糟，是因為死亡對朋友本人是壞的。所以死亡最核心的壞處，是對死去的人的壞處。難題在於：如果死亡就是結束，死者已經不存在，死亡怎麼還能對他是壞的？這是下一講的問題。
argsNote: 「P 功能」（person functioning）是 Kagan 自己的用語，指思考、溝通、有創造力等「人」才有的高階功能，相對於心跳、消化等「B 功能」。Freud 的引文出自〈戰爭與死亡的時代思考〉（1915），Kagan 是從 Walter Kaufmann 的文章轉引。Kagan 說伊凡·伊里奇想起的三段論是「蘇格拉底會死」；托爾斯泰原文用的是 Kiesewetter 邏輯課本裡的「凱猶斯」（Caius），意思相同。他說伊凡「也許有遺囑和壽險」，是他自己的推測，小說沒有寫。「孤獨死去」的討論以 Paul Edwards 批評存在主義的文章為背景；延伸：意思五接近海德格在《存在與時間》§47 的說法（沒有人能取走他人的死），支持海德格的讀者認為他的重點不在文法，而在死亡是每個人「最本己」的可能性，Kagan 沒有討論這個讀法。瑪土撒拉的論證思路接近 Derek Parfit「同一性不是重要的事」的主張，Kagan 在這幾講沒有提到他。
