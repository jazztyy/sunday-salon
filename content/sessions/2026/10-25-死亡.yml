tldr:
  - Kagan 認為存活中重要的不是「還是我」，而是將來有一個人格和現在<b>相似</b>的人。瑪土撒拉活到 969 歲，人格慢慢變得完全不同，就算還是他，也給不了他想要的。
  - 物理主義下，Kagan 認為死亡就是身體壞了：不再<b>能夠</b>進行 P 功能（思考、溝通、規畫）。睡著的人只是沒在做，能力還在，所以沒死。
  - 身體功能和 P 功能可以分開停止（階段 D）。依身體觀，那時我活著卻不是人；依人格觀，我已經不存在，但我的身體還活著。
  - Freud 說每次想像自己死了，都會把自己當成旁觀者偷渡回去，所以沒有人真的相信自己會死。Kagan 認為這個論證很糟：想像一場你缺席的會議也一樣，但你相信會議會照開。
  - 「每個人都孤獨地死去」：Kagan 試了六種解讀，沒有一種同時為真、必然、又說出死亡特有的東西，他直說這是胡說。
  - 死亡的核心壞處不是生者失去了這個人。Kagan 用兩個太空船故事說明：真正要問的是，死亡怎麼會對已經不存在的死者是壞的。
stance:
  - - 存活
    - 重要的不是存活本身，而是有一個人格和他相似的人。他不相信死後會有這樣的人
  - - 死亡
    - 身體壞了，不再能夠進行 P 功能。他認為死亡沒有什麼神秘的。他自己傾向身體觀
  - - 相信會死
    - Freud 的論證不成立；「和死亡擦身而過」的論證值得認真看，但他不確定對不對
  - - 孤獨死去
    - 找不到一種解讀能同時為真、必然又有意思，他認為這個說法是胡說
  - - 死亡的壞處
    - 核心不是對生者的壞處，而是對死者本人的壞處。怎麼可能，留到下一講
