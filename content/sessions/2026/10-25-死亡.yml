  - name: 死亡的定義
    kind: 死亡的本質
    vid: euLOYs3p-DA
    t: 86
    ts: 講座 15 · 01:26
    prem:
      - - 死了就是不再進行 P 功能（思考、溝通、規畫）。
        - 深沉無夢的睡眠裡也沒有 P 功能，照這個定義，人每晚會死好幾次。
      - - 修正：永久停止 P 功能才算死，暫時停止不算。
        - 如果審判日真的有復活，死者的停止就只是暫時的，他們從來沒死過。但復活顯然不是叫醒睡著的人。
      - - 再修正：失去進行 P 功能的能力才算死，也就是支撐這些能力的大腦結構壞了。
        - null
        - Kagan 認為這最接近正確。睡著的人叫醒就能算九九乘法，能力還在；等待復活的死者此刻大腦是壞的，要等上帝修好。
    concl: 死亡是身體壞了，不再能夠進行 P 功能。
    verdict: 這個定義也能處理昏迷：開關只是卡住，就還活著；大腦結構壞了，人就不存在了。但假死的 Larry 大腦沒壞，依定義不算死，說他活著卻也很怪。Kagan 認為可能需要第三個類別「暫停」，至於怎麼區分「活著」和「暫停」，他說自己也不確定，留給大家想。
  - name: Freud：沒有人相信自己會死
    kind: 對死亡的信念
    vid: euLOYs3p-DA
    t: 1058
    ts: 講座 15 · 17:38
    prem:
      - - 要相信一件事，必須能想像它的畫面。
        - null
        - Kagan 懷疑這個關於信念的理論，但為了論證先讓步，不從這裡反駁。
      - - 我無法從內部想像死了是什麼感覺。
        - null
        - Kagan 同意，但原因不是想像力不夠，而是那裡本來就沒有任何感覺可想像，就像問當一支手機是什麼感覺。無夢的睡眠、昏倒也一樣想像不了，我們還是相信自己會睡著、會昏倒。
      - - 從外部想像也不算數：每次想像自己的葬禮，我都把自己當成旁觀者偷渡回去。
        - 想像一場自己缺席的會議，也是從牆角某個位置看著它，但沒有人因此不相信會議會在沒有你的情況下舉行。觀看圖像要從某個位置，不代表你在圖像的內容裡。
    concl: 沒有人真的相信自己會死；在潛意識裡，每個人都相信自己不朽。
    verdict: Kagan 說這是一個很糟的論證，卻常有人提出。他區分兩件事：圖像的內容裡有沒有我，和我是不是從某個位置在看。前者才決定我想像的是不是「沒有我的世界」。
  - name: 和死亡擦身而過
    kind: 最佳解釋推論
    vid: sAauJgy4lPg
    t: 292
    ts: 講座 16 · 04:52
    prem:
      - - 和死亡擦身而過的人，死亡變得鮮明，常會改變生活：少花時間在工作和賺錢，多陪家人，告訴所愛的人他們有多重要。
        - null
        - Kagan 接受這是常見的現象，但這是經驗主張，他沒有引用研究。
      - - 我們大多數人並沒有這樣生活。
        - null
        - 大部分人還是花很多時間追求升遷、賺錢，很少告訴家人朋友他們有多重要。
      - - 最好的解釋是：我們雖然嘴上說會死，卻沒有在根本上相信。
        - Kagan 說他完全不確定這是不是最好的解釋，只說這個論證值得認真看。他沒有提出其他解釋；延伸：也可能是相信，只是平常不去想，或知道該改卻做不到。
