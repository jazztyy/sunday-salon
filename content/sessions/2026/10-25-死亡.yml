    verdict: Kagan 先否決了另一個版本：「真的相信就會一直尖叫，沒人在尖叫，所以沒人真的相信」。他認為沒有理由相信那個條件句。相比之下，擦身而過的論證是他能想到最有可能成立的一個。
  - name: 每個人都孤獨地死去
    kind: 概念分析
    vid: sAauJgy4lPg
    t: 491
    ts: 講座 16 · 08:11
    prem:
      - - 意思一：死的時候身邊沒有別人。
        - 不是真的。蘇格拉底在朋友和學生圍繞下喝下毒芹而死。
      - - 意思二：就算身邊有人，他們沒有和你一起死。
        - 不是真的。戰場上很多人同時死去。
      - - 意思三：死亡不能是一起進行的共同行動。
        - 不是真的。殉情或集體自殺的約定，就像弦樂四重奏一樣，是彼此協調的共同行動。
      - - 意思四：沒有人能代替我死。
        - 不是真的。《雙城記》的主角代替另一個人上斷頭台；美國南北戰爭時，有錢人可以雇人代替自己上戰場。
      - - 意思五：沒有人能死「我的」死，他只能死他自己的。
        - 為真，也是必然的，但沒有人能替我剪「我的」頭髮、吃「我的」午餐，也一樣成立。這只是「我的」這個字的文法，不是死亡特有的。
      - - 意思六：死的時候，心理上感到孤獨、疏離。
        - 伊凡·伊里奇也許如此，但不是每個人都這樣：睡夢中猝死、和朋友聊天時被卡車撞死的人沒有；知道自己快死的蘇格拉底和休謨，臨終時也都不孤獨。
    concl: 每個人都孤獨地死去，而且這揭露了死亡特有的本質。
    verdict: Kagan 先訂出四個條件：要為真、要是必然的、要有意思、至少要對死亡算特別。他試了每一種解讀，沒有一種全部過關，所以他直說這是胡說：說的人沒想過自己在說什麼。他也邀請大家找他漏掉的解讀。
