tldr:
  - Kagan 檢查的多數靈魂論證都是「最佳解釋推論」：某個現象需要解釋，所以假設靈魂存在。他的問題永遠是：靈魂是不是<b>最好的</b>解釋，而不只是<b>一種</b>解釋。
  - 自由意志論證需要三個前提同時成立，而每一個都有人提出合理的質疑。
  - 瀕死體驗是真實的經驗。Kagan 認為，腦內啡、視覺皮質受刺激等生理解釋，已經足以和「靈魂離體」競爭。
  - 笛卡兒說：我能想像心靈沒有身體，所以兩者不同。Kagan 用晨星與昏星（其實都是金星）當反例。
  - 柏拉圖的《斐多篇》預設靈魂存在，真正要論證的是<b>靈魂不朽</b>。前三個論證 Kagan 都認為不成立。
stance:
  - - 整體立場
    - 物理主義者：人就是一個能做特定事情的身體，沒有非物質的靈魂
  - - 自由意志
    - 相信人有自由意志，並且是相容論者
  - - 保留之處
    - 承認意識（例如咖啡的味道、看到紅色的感覺）目前物理主義還解釋不了
  - - 態度
    - 明說這是理性的人可以有不同意見的問題，邀請大家自己判斷
