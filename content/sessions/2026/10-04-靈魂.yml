args:
  - name: 自由意志論證
    kind: 最佳解釋推論
    vid: S-fwH_uBPD0
    t: 0
    ts: 講座 5 · 00:00
    prem:
      - - 我們有自由意志。
        - null
        - Kagan 接受，他相信人有自由意志。不過也有哲學家認為自由意志只是錯覺：我們感覺自己「本來可以選別的」，但這種感覺無法直接觀察。
      - - 受決定論支配的東西不可能有自由意志。
        - 相容論認為兩者可以並存：就算倒帶重播每次結果都一樣，人仍然可以是自由的。Kagan 自己就是相容論者。
      - - 所有純物理系統都受決定論支配。
        - 依照量子力學的標準詮釋，基礎物理定律是機率性的。放射性原子「有 80% 機率衰變」，除此之外沒有更深的原因。（Kagan 也強調自己不是物理學家。這點在物理學界仍有爭議，例如多世界詮釋和玻姆詮釋都是決定論的。）
    concl: 我們不只是物理系統，必須有靈魂。
    verdict: 三個前提都要成立結論才會出來，而每一個都有人提出合理的質疑。這不等於論證失敗，但用它來證明靈魂存在，要做的功課很多。
  - name: 瀕死體驗論證
    kind: 最佳解釋推論
    vid: S-fwH_uBPD0
    t: 1037
    ts: 講座 5 · 17:17
    prem:
      - - 許多人在心跳停止後被救回，描述出高度相似的經驗：離開身體、從上方看自己、穿過隧道看到光、見到過世的親人。
        - null
        - Kagan 接受這些經驗真的發生過，也不認為「他們又沒真的死，所以證詞不算數」這個反駁成立：住過法國 20 年的人，就算最後回來了，還是能告訴你法國是什麼樣子。
      - - 對這些經驗最好的解釋是：靈魂暫時離開身體，進入了下一個世界（「兩個房間」解釋）。
        - 「一個房間」解釋同樣可行：生命是生物過程，接近終點時會出現不尋常的生理狀態。壓力下釋放的腦內啡可以解釋欣快感，視覺皮質受到異常刺激可以解釋光和隧道。
    concl: 靈魂存在，而且能在身體之外存在。
    verdict: 瀕死經驗本身是可以接受的證據，真正的爭點只在於哪個解釋比較好。Kagan 認為生理解釋雖然還沒完整，但雛形已經夠有說服力。
  - name: 笛卡兒的可想像性論證
    kind: 純哲學論證
    vid: qkjIKIpvz6Y
    t: 346
    ts: 講座 5 · 37:34 ／ 講座 6 · 05:46
    prem:
      - - 我可以想像心靈存在而身體不存在：早上醒來，鏡子裡沒有自己，摸不到頭，卻還在恐慌地思考。
        - 診斷一：你以為自己想像了那個情境，其實描述錯了自己想像的內容。（Kagan 認為用在身心問題上不太有說服力。）
      - - 如果能想像 A 存在而 B 不存在，A 和 B 就不是同一個東西。
        - 診斷二：想像不一定是「邏輯上可能」的可靠指引，就像有人覺得自己勉強能想像圓的方形。診斷三：同一性也許是偶然的，這個世界 A=B，別的可能世界不是。但這個概念本身也很費解。
    concl: 心靈不是身體，而是另外的東西：靈魂。
    verdict: 反例：我能輕易想像昏星存在而晨星不存在，但兩者其實都是金星。同樣結構的論證在天文學上明顯失敗，所以笛卡兒的版本也不能照單全收。難處在於，哲學家都同意晨星昏星的版本錯了，卻對「到底錯在哪裡」沒有共識。另外，這裡是 Kagan 簡化過的版本：笛卡兒在《沉思錄》第六沉思的原始論證，還牽涉到「清楚分明的認識」與上帝有能力把兩者分開。
  - name: 論證一：形式的本質
    kind: 《斐多篇》
    vid: ZHH8KDFysbM
    t: 858
    ts: 講座 7 · 14:18
    prem:
      - - 形式（美本身、正義本身、數字 3）是永恆且非物質的。
        - null
        - Kagan 暫且讓給柏拉圖。他說這堂課不打算爭論形式論本身，而且它不是荒謬的觀點，拿數學來想就很有說服力。
      - - 永恆、非物質的東西，只能被永恆、非物質的東西掌握。
        - 這就是「物以類聚、惺惺相惜」。但動物學家不必是貓，加拿大人可以研究墨西哥人，醫生研究屍體也不必是屍體。就算一般情況不成立、只在形式上成立，柏拉圖也沒給理由。
    concl: 掌握形式的靈魂本身是永恆、非物質的，所以不朽。
    verdict: 前提一暫且讓給柏拉圖，關鍵全在前提二，而它缺乏根據。Kagan 也提醒，柏拉圖接著又提出好幾個論證，可能他自己也知道這個論證不夠強。
  - name: 論證二：回收論證
    kind: 《斐多篇》
    vid: ZHH8KDFysbM
    t: 1483
    ts: 講座 7 · 24:43
    prem:
      - - 事物由先前就存在的零件組成，毀壞後零件會被回收再利用。就像汽車拆了，輪胎和方向盤還在。
        - null
        - Kagan 接受。構成身體的原子在我們出生前就存在，死後也會繼續存在，之後被拿去組成別的東西。
      - - 靈魂是組成我們的零件之一。
        - null
        - 《斐多篇》本來就預設靈魂存在，Kagan 在這裡也暫且接受，問題不在這一步。
      - - （隱含）靈魂是那種早就存在、之後會被回收的基本零件。
        - 心臟也是我的一部分，卻不是出生前就存在，死後也很快會分解。「有些零件被回收」推不出「每個零件都被回收」，靈魂可能比較像心臟而不像原子。
    concl: 靈魂在我們死後會繼續存在。
    verdict: 要讓這個論證成立，得先證明靈魂是出生前就存在的基本零件。柏拉圖的下一個論證正是要補這個洞。
  - name: 論證三：回憶說
    kind: 《斐多篇》
    vid: ZHH8KDFysbM
    t: 2030
    ts: 講座 7 · 33:50
    prem:
      - - 被某個東西「提醒」，前提是先前就認識被提醒的對象。露絲的照片再模糊也能讓我想起她，但沒見過露絲的人看了不會想起任何人。
        - 也許不需要先前認識：我看過彎的、比較直的、更直的東西，心靈可以從這裡「外推」出完全的直。
      - - 不完美的東西會讓我們想到完美的形式：有點圓的盤子讓人想到完美的圓。
        - null
        - Kagan 接受這個現象：不完美的東西確實會讓我們想到完美的形式。爭點在於怎麼解釋它。
      - - 這輩子從來沒遇過完美的形式。
        - 就算需要直接認識形式，也不一定在這輩子遇不到。為什麼不能是今生才第一次認識？（Kagan 下一講會接著談）
    concl: 靈魂在出生之前就已經存在，並在那時認識了形式。
    verdict: 這個論證剛好回應回收論證的缺口：它試圖證明靈魂是出生前就存在的零件。但就算成立，也只證明了「出生前存在」，還沒證明「死後存在」。
argsNote: 《斐多篇》三個論證的編號和名稱依照 Kagan 上課的重建方式，不是原文的順序。原文先出現的是回收論證（原文用的是醒與睡、生與死這類「對立者互相轉化」的例子，汽車零件是 Kagan 的改寫），接著是回憶說；「形式的本質」比較接近原文後段的「親緣論證」。
