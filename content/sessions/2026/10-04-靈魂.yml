    recall:
      - - 自由意志論證的三個前提是什麼？Kagan 對每一個怎麼看？
        - P1 我們有自由意志（他接受）；P2 決定論與自由意志不相容（他是相容論者，拒絕）；P3 物理系統都受決定論支配（依量子力學的標準詮釋，不成立）。
      - - 「兩個房間」和「一個房間」分別怎麼解釋瀕死體驗？
        - 兩個房間：靈魂暫時離開這一世，進入或望見下一個世界。一個房間：只有這一生，接近生命終點時身體出現不尋常的生理狀態，例如腦內啡帶來欣快感、視覺皮質受刺激看到光和隧道。
      - - Kagan 為什麼說二元論只是一張「支票」？
        - 二元論通常只說「假設有個非物質的東西」，並沒有真正說明它如何產生意識或自由意志。「還沒看出物理如何解釋」不等於「物理不可能解釋」。
