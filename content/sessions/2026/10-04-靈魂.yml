      - - 柏拉圖的「形式」是什麼？舉一個例子。
        - 完美、永恆、非物質的存在，例如美本身、正義本身、完美的圓、數字 3。世上的東西只是不同程度地「分有」形式，但心靈可以思考形式本身。
