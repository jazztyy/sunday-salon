# 部署到 GitHub Pages。規格見 SPEC.md「輸出與發佈」。
#
# 目前只能手動觸發（Actions → Deploy to GitHub Pages → Run workflow）。
# Kai 確認後，把下面的 push 解除註解，push 到 main 就會自動部署：
#
#   push:
#     branches: [main]
#
# 前提：repo 設定 → Pages → Source 選「GitHub Actions」。免費方案需要公開 repo。

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run generate  # 先跑內容檢查（scripts/check-content.mjs）再建置
        env:
          NUXT_APP_BASE_URL: /sunday-salon/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
